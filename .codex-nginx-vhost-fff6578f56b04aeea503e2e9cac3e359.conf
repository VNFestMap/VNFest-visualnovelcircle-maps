server {
    listen 80;
    server_name map.vnfest.top 162.251.93.178 www.map.vnfest.top;
    return 301 https://www.map.vnfest.top$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;

    server_name map.vnfest.top 162.251.93.178 www.map.vnfest.top;
    root /www/wwwroot/162.251.93.178;
    index index.php index.html index.htm default.php default.htm default.html;

    include /www/server/panel/vhost/nginx/extension/162.251.93.178/*.conf;

    ssl_certificate     /www/server/panel/vhost/cert/162.251.93.178/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/162.251.93.178/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 497 https://www.map.vnfest.top$request_uri;
    error_page 404 /404.html;

    # Go backend cutover (PHP-FPM removed from the active request path).
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }

    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $host$1$is_args$args;
    }

    include /www/server/panel/vhost/nginx/proxy/162.251.93.178/*.conf;
    include /www/server/panel/vhost/rewrite/162.251.93.178.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md|PROJECT_STRUCTURE.md|package\.json|config\.php|config\.example\.php)$ {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # 禁止公开读取运行数据、数据库、验证码、提交记录等
    location ^~ /.vnfest-private-backups/ { return 404; }
    location ~* ^/data/.*\.(json|db|sqlite|sqlite3|sql|bak|backup|old|log)$ {
        return 404;
    }

    location ^~ /data/manuscripts/ {
        return 404;
    }

    location ^~ /data/cache/ {
        return 404;
    }

    # 用户上传文件目录不允许执行脚本
    location ~* ^/(uploads|wiki/uploads)/.*\.(php|php[0-9]?|phtml|phar|jsp|py|sh|cgi|pl)$ {
        return 403;
    }

    access_log /www/wwwlogs/162.251.93.178.log;
    error_log  /www/wwwlogs/162.251.93.178.error.log;
}
