  <style>
    :root {
      --font-display: 'Noto Serif SC', 'STZhongsong', 'SimSun', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Microsoft YaHei', system-ui, sans-serif;
      --ease-spring:  cubic-bezier(0.22, 1, 0.36, 1);
      --primary: var(--md-primary, #e74c3c);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }

    body {
      min-height: 100vh;
      background: var(--md-surface-container, #0a0c18);
      color: var(--md-on-surface, #dddae4);
      font-family: var(--font-body);
      font-size: 15px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 5%, rgba(231,76,60,0.07), transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(104,152,208,0.05), transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(78,168,158,0.04), transparent 50%);
    }

    .topbar {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 24px; background: rgba(8,10,22,0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar-brand { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
    .topbar-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px;
      border: 1px solid var(--md-outline-variant); border-radius: 8px;
      background: var(--md-surface); color: var(--md-on-surface-variant); font-size: 13px;
    }
    .topbar-btn:hover { border-color: var(--md-outline); color: var(--md-on-surface); }
    .topbar-btn.primary { background: rgba(231,76,60,0.12); color: var(--primary); border-color: rgba(231,76,60,0.2); }

    .create-shell { max-width: 860px; margin: 0 auto; padding: 28px; }

    .breadcrumb { display: flex; gap: 8px; font-size: 13px; color: var(--md-on-surface-variant); margin-bottom: 16px; }
    .breadcrumb a:hover { color: var(--primary); }

    .create-card {
      background: var(--md-surface); border: 1px solid var(--md-outline-variant); border-radius: 14px;
      padding: 28px;
    }
    .create-card h1 { font-family: var(--font-display); font-size: 22px; margin-bottom: 24px; }

    .form-row { margin-bottom: 20px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--md-on-surface-variant); }
    .form-row label .required { color: var(--primary); margin-left: 2px; }
    .form-row input[type="text"], .form-row select, .form-row textarea {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-high);
      color: var(--md-on-surface); font-size: 15px; outline: none;
    }
    .form-row input[type="text"]:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--primary); }
    .form-row input[type="text"].error { border-color: var(--md-danger, #f05a68); }
    .form-row textarea { min-height: 280px; resize: vertical; line-height: 1.7; }

    .category-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .category-chip {
      padding: 6px 12px; border-radius: 20px; border: 1px solid var(--md-outline-variant);
      background: transparent; color: var(--md-on-surface-variant); font-size: 13px; cursor: pointer;
    }
    .category-chip:hover { border-color: var(--md-outline); color: var(--md-on-surface); }
    .category-chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    .tag-input {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 10px; border: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container-high);
    }
    .tag-input input { flex: 1; min-width: 120px; border: none; background: transparent; padding: 4px; color: var(--md-on-surface); outline: none; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 5px; font-size: 12px; background: var(--md-surface-muted); color: var(--md-on-surface); }
    .tag button { background: transparent; border: none; color: var(--md-on-surface-variant); font-size: 12px; }

    .editor-toolbar {
      display: flex; align-items: center; gap: 6px; padding: 8px; margin-bottom: 8px;
      border: 1px solid var(--md-outline-variant); border-radius: 10px 10px 0 0;
      background: var(--md-surface-container-high);
    }
    .editor-toolbar button {
      width: 30px; height: 30px; display: inline-grid; place-items: center;
      border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--md-on-surface-variant);
    }
    .editor-toolbar button:hover { background: var(--md-surface); border-color: var(--md-outline-variant); }
    .form-row textarea#content { border-radius: 0 0 10px 10px; border-top: none; }

    .upload-zone {
      margin-top: 12px; padding: 16px; border: 2px dashed var(--md-outline-variant); border-radius: 10px;
      text-align: center; color: var(--md-on-surface-variant); font-size: 13px;
    }
    .upload-zone.dragover { border-color: var(--primary); background: var(--md-primary-container); }

    .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .form-actions .btn {
      padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600;
    }
    .form-actions .btn.secondary { background: var(--md-surface-muted); color: var(--md-on-surface); border: 1px solid var(--md-outline-variant); }
    .form-actions .btn.primary { background: var(--primary); color: #fff; border: none; }
    .form-actions .btn.primary:hover { filter: brightness(1.05); }

    .limit-hint { font-size: 12px; color: var(--md-on-surface-variant); margin-top: 6px; }
    .error-msg { color: var(--md-danger, #f05a68); font-size: 12px; margin-top: 6px; display: none; }

    @media (max-width: 760px) {
      .topbar { padding: 10px 16px; }
      .create-shell { padding: 16px; }
      .create-card { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }
  </style>
  <link rel="stylesheet" href="./assets/css/forum-runtime.css?v=20260810-forum11">
</head>
<body data-forum-page="create">
  <header class="topbar">
    <div class="topbar-left">
      <a class="topbar-brand" href="./forum-plaza.html" aria-label="返回论坛广场">论坛</a>
    </div>
    <div class="topbar-right">
      <button class="theme-toggle topbar-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a class="topbar-btn forum-map-link" data-forum-map-link data-forum-nav-feedback="map" href="../index.html?guest=1" aria-label="返回地图">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15M15 6v15"/></svg>
        <span class="forum-map-link-label">返回地图</span>
      </a>
    </div>
  </header>

  <main class="create-shell">
    <nav class="breadcrumb">
      <a href="./forum-plaza.html">论坛广场</a><span>/</span><span>发布帖子</span>
    </nav>

    <form class="create-card forum-authoring-card" id="postForm">
      <header class="forum-create-heading">
        <div><h1>发布新帖</h1><p>内容将发布到论坛广场</p></div>
      </header>

      <div class="form-row forum-title-row">
        <div class="forum-label-line"><label for="title">标题 <span class="required">*</span></label><output id="forumTitleCount" for="title">0 / 100</output></div>
        <input type="text" id="title" name="title" maxlength="100" placeholder="一句话概括你想讨论的内容" />
        <div class="error-msg" id="titleError">请输入标题</div>
      </div>

      <div class="forum-create-meta">
        <div class="form-row">
          <label>分类 <span class="required">*</span></label>
          <div class="category-group" id="categoryGroup" aria-label="帖子分类"></div>
          <input type="hidden" id="category" name="category" />
        </div>

        <div class="form-row">
          <label>标签</label>
          <div class="tag-input" id="tagInput">
            <input type="text" maxlength="20" placeholder="输入后按回车" aria-describedby="forumTagHint" />
          </div>
          <div class="limit-hint" id="forumTagHint">最多 5 个，每个不超过 20 字</div>
        </div>
      </div>

      <div class="form-row forum-body-row">
        <div class="forum-composer-head">
          <label for="forumVisualEditor">正文 <span class="required">*</span></label>
          <button class="forum-help-button" type="button" id="forumMarkdownHelp">Markdown 帮助</button>
        </div>
        <div class="forum-composer-tabs" id="forumCreateEditorTabs" role="tablist" aria-label="正文编辑模式">
          <button id="forumCreateEditTab" type="button" role="tab" aria-selected="true" aria-controls="forumCreateEditorPanel" data-editor-tab="visual">写作</button>
          <button id="forumCreatePreviewTab" type="button" role="tab" aria-selected="false" aria-controls="forumCreatePreviewPanel" data-editor-tab="preview" tabindex="-1">预览</button>
          <button id="forumCreateSourceTab" type="button" role="tab" aria-selected="false" aria-controls="forumCreateSourcePanel" data-editor-tab="source" tabindex="-1">Markdown 源码</button>
        </div>

        <div class="forum-editor-layout">
          <section class="forum-editor-pane is-active" id="forumCreateEditorPanel" role="tabpanel" aria-labelledby="forumCreateEditTab">
            <div class="editor-toolbar" aria-label="正文格式工具栏">
              <span class="forum-toolbar-group"><button type="button" data-md="heading2" aria-label="二级标题">H2</button><button type="button" data-md="heading3" aria-label="三级标题">H3</button></span>
              <span class="forum-toolbar-group"><button type="button" data-md="bold" aria-label="加粗"><strong>B</strong></button><button type="button" data-md="italic" aria-label="斜体"><em>I</em></button></span>
              <span class="forum-toolbar-group"><button type="button" data-md="unordered-list" aria-label="无序列表">列表</button><button type="button" data-md="ordered-list" aria-label="有序列表">1. 列表</button><button type="button" data-md="quote" aria-label="引用">引用</button></span>
              <span class="forum-toolbar-group"><button type="button" data-md="inline-code" aria-label="行内代码">代码</button><button type="button" data-md="code-block" aria-label="代码块">代码块</button></span>
              <span class="forum-toolbar-group"><button type="button" data-md="link" aria-label="插入链接">链接</button><button type="button" data-md="image" aria-label="上传并插入图片">图片</button></span>
            </div>
            <div id="forumVisualEditor" class="forum-rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="正文写作区" aria-describedby="forumMarkdownHint" data-placeholder="从这里开始写下你的内容…"></div>
            <div class="forum-editor-status"><output id="forumBodyCount" for="content">0 / 50,000</output><span id="forumDraftStatus" role="status">尚未保存草稿</span></div>
          </section>

          <section class="forum-editor-pane forum-preview-pane" id="forumCreatePreviewPanel" role="tabpanel" aria-labelledby="forumCreatePreviewTab">
            <div class="forum-preview-heading"><span>实时预览</span><span id="forumCreatePreviewStatus" role="status" aria-live="polite">已同步</span></div>
            <div class="forum-markdown-preview post-content" id="forumCreatePreview">
              <div class="forum-preview-empty"><strong>正文预览会显示在这里</strong><span>使用工具栏或直接输入 Markdown。</span></div>
            </div>
          </section>

          <section class="forum-editor-pane forum-source-pane" id="forumCreateSourcePanel" role="tabpanel" aria-labelledby="forumCreateSourceTab" hidden aria-hidden="true">
            <div class="forum-source-heading"><span>Markdown 源码</span><span>发布时仍会经过论坛安全校验</span></div>
            <textarea id="content" name="content" maxlength="50000" placeholder="也可以直接编辑 Markdown…" aria-describedby="forumMarkdownHint"></textarea>
          </section>
        </div>
        <span class="forum-sr-only" id="forumMarkdownHint">支持标题、列表、引用、代码、HTTP(S) 链接、提及和 Forum 上传图片；不支持原始 HTML 或外部图片。</span>
        <div class="error-msg" id="contentError">请输入正文内容</div>
      </div>

      <section class="forum-media-section" aria-labelledby="forumMediaTitle">
        <div class="forum-media-head">
          <div><h2 id="forumMediaTitle">正文图片</h2><span id="forumUploadCount">0 / 20</span></div>
          <button type="button" id="forumUploadButton">添加图片</button>
        </div>
        <div class="upload-zone" id="uploadZone">
          <strong>拖入图片，或点击选择</strong>
          <span>也可以直接粘贴；单张 ≤ 10MB</span>
        </div>
      </section>

      <div class="form-actions forum-create-actions">
        <span id="forumPublishStatus" role="status">内容会自动保存为本机草稿</span>
        <a class="btn secondary" href="./forum-plaza.html">取消</a>
        <button type="submit" class="btn primary" id="forumSubmitPost">发布帖子</button>
      </div>
    </form>
  </main>

  <footer class="forum-footer forum-site-footer" aria-label="论坛信息">
    <div class="forum-footer-inner forum-footer-inner--links-only">
      <nav class="forum-footer-links" aria-label="论坛政策与说明">
        <a href="./forum-plaza.html#rules">社区规则</a>
        <a href="./forum-plaza.html#about">关于论坛</a>
        <a href="./forum-plaza.html#privacy">隐私政策</a>
      </nav>
    </div>
  </footer>

  <script src="../js/page-background.js?v=20260812-centralized-preferences"></script>
<script src="./assets/js/forum-common.js?v=20260810-forum11"></script>
  <script src="./assets/js/forum-pages.js?v=20260810-forum11"></script>
</body>
</html>
