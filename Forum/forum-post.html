  <style>
    :root {
      --font-display: 'Noto Serif SC', 'STZhongsong', 'SimSun', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Microsoft YaHei', system-ui, sans-serif;
      --ease-spring:  cubic-bezier(0.22, 1, 0.36, 1);
      --primary: var(--md-primary, #e74c3c);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }

    body {
      min-height: 100vh;
      background: var(--md-surface-container, #0a0c18);
      color: var(--md-on-surface, #dddae4);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 5%, rgba(231,76,60,0.07), transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(104,152,208,0.05), transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(78,168,158,0.04), transparent 50%);
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 24px;
      background: rgba(8,10,22,0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar-brand { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
    .topbar-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border: 1px solid var(--md-outline-variant); border-radius: 8px;
      background: var(--md-surface, #121424); color: var(--md-on-surface-variant, #8c88a4);
      font-size: 13px; font-weight: 500; transition: all 0.18s ease;
    }
    .topbar-btn:hover { border-color: var(--md-outline); color: var(--md-on-surface); }
    .topbar-btn.primary { background: rgba(231,76,60,0.12); color: var(--primary); border-color: rgba(231,76,60,0.2); }

    /* Shell */
    .post-shell { max-width: 960px; margin: 0 auto; padding: 28px; }

    /* Breadcrumb */
    .breadcrumb {
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
      font-size: 13px; color: var(--md-on-surface-variant);
    }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .sep { opacity: 0.6; }

    /* Main post */
    .main-post {
      background: var(--md-surface, rgba(18,20,36,0.88));
      border: 1px solid var(--md-outline-variant);
      border-radius: 14px; overflow: hidden;
    }
    .post-header {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 24px; border-bottom: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container-high, rgba(24,26,46,0.92));
    }
    .post-header .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--md-surface-muted); }
    .post-header .author { font-weight: 600; color: var(--md-on-surface); }
    .post-header .meta { color: var(--md-on-surface-variant); font-size: 13px; margin-top: 2px; }
    .post-tags { margin-left: auto; display: flex; gap: 6px; }
    .post-tag {
      padding: 3px 10px; border-radius: 5px; font-size: 12px; font-weight: 600;
      background: var(--md-surface-muted); color: var(--md-on-surface-variant);
    }

    .post-content { padding: 24px; font-size: 15px; line-height: 1.75; color: var(--md-on-surface); }
    .post-content h1, .post-content h2, .post-content h3 { font-family: var(--font-display); margin: 18px 0 10px; color: var(--md-on-surface); }
    .post-content p { margin-bottom: 12px; }
    .post-content img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
    .post-content blockquote {
      margin: 14px 0; padding: 12px 16px; border-left: 3px solid var(--primary);
      background: var(--md-primary-container, rgba(231,76,60,0.08));
      border-radius: 0 10px 10px 0; color: var(--md-on-surface-variant);
    }

    .post-actions {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px;
      border-top: 1px solid var(--md-outline-variant);
    }
    .post-actions button {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--md-outline-variant);
      background: transparent; color: var(--md-on-surface-variant); font-size: 13px;
      transition: all 0.18s ease;
    }
    .post-actions button:hover { border-color: var(--md-outline); color: var(--md-on-surface); }
    .post-actions .like:hover, .post-actions .like.active { background: rgba(231,76,60,0.12); color: var(--primary); border-color: rgba(231,76,60,0.2); }

    /* Replies */
    .replies { margin-top: 24px; }
    .replies-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .replies-header h3 { font-family: var(--font-display); font-size: 18px; }
    .replies-header .count { color: var(--md-on-surface-variant); font-size: 13px; }
    .reply-list { display: flex; flex-direction: column; gap: 12px; }
    .reply-item {
      display: grid; grid-template-columns: 44px 1fr; gap: 14px;
      padding: 18px; border-radius: 12px;
      background: var(--md-surface); border: 1px solid var(--md-outline-variant);
      transition: background 0.15s ease;
    }
    .reply-item:nth-child(odd) { background: var(--md-surface-container-high); }
    .reply-item .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--md-surface-muted); }
    .reply-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .reply-author { font-weight: 600; font-size: 14px; }
    .reply-time { font-size: 12px; color: var(--md-on-surface-variant); }
    .reply-body { font-size: 15px; line-height: 1.7; color: var(--md-on-surface); }
    .reply-body p { margin-bottom: 8px; }
    .reply-body .quote {
      margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--primary);
      background: var(--md-primary-container); border-radius: 0 8px 8px 0;
      font-size: 14px; color: var(--md-on-surface-variant);
    }
    .reply-foot { margin-top: 10px; }
    .reply-foot button {
      padding: 4px 10px; border-radius: 6px; border: 1px solid var(--md-outline-variant);
      background: transparent; color: var(--md-on-surface-variant); font-size: 12px;
    }
    .reply-foot button:hover { color: var(--primary); border-color: var(--primary); }

    /* Quick reply */
    .quick-reply {
      margin-top: 24px; padding: 20px;
      background: var(--md-surface); border: 1px solid var(--md-outline-variant); border-radius: 14px;
    }
    .quick-reply h4 { font-family: var(--font-display); margin-bottom: 12px; }
    .quick-reply textarea {
      width: 100%; min-height: 120px; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-high);
      color: var(--md-on-surface); font-size: 14px; line-height: 1.6; resize: vertical;
      outline: none;
    }
    .quick-reply textarea:focus { border-color: var(--primary); }
    .reply-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 12px;
    }
    .reply-toolbar .hint { font-size: 12px; color: var(--md-on-surface-variant); }
    .reply-toolbar button {
      padding: 8px 18px; border-radius: 8px; border: none;
      background: var(--primary); color: #fff; font-weight: 600;
      transition: transform 0.15s var(--ease-spring);
    }
    .reply-toolbar button:hover { transform: translateY(-1px); filter: brightness(1.05); }

    /* Responsive */
    @media (max-width: 760px) {
      .topbar { padding: 10px 16px; }
      .post-shell { padding: 16px; }
      .post-header { padding: 16px; }
      .post-content { padding: 16px; }
      .reply-item { grid-template-columns: 36px 1fr; padding: 14px; }
      .reply-item .avatar { width: 36px; height: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }
  </style>

<body data-forum-page="post">

    <div class="topbar-left">
      <a class="topbar-brand" href="./forum-plaza.html" aria-label="返回论坛广场">论坛</a>
    </div>
    <div class="topbar-right">

        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

        <span class="forum-map-link-label">返回地图</span>

  <main class="post-shell">
    <nav class="breadcrumb">
      <a href="./forum-plaza.html">论坛广场</a><span class="sep">/</span><span>帖子详情</span>
    </nav>

    <article class="main-post" id="forumPostRoot">
      <div class="forum-runtime-state"><strong>正在读取帖子…</strong><span>请稍候</span></div>
    </article>

    <section class="replies" aria-labelledby="forumRepliesTitle">
      <div class="replies-header">
          <h3 id="forumRepliesTitle">全部回复 <span class="count" id="forumReplyCount">0 条</span></h3>
        <div class="sort-group">
            <button class="topbar-btn active" type="button" data-reply-sort="time" aria-pressed="true">按时间</button>
            <button class="topbar-btn" type="button" data-reply-sort="hot" aria-pressed="false">按热度</button>
        </div>
      </div>
      <div class="reply-list" id="forumReplyList">
        <div class="forum-runtime-state"><strong>正在读取回复…</strong></div>
      </div>
      <div class="forum-runtime-pagination" id="forumReplyPagination" aria-label="回复分页"></div>
    </section>

    <section class="quick-reply" aria-labelledby="forumQuickReplyTitle">
      <div class="quick-reply-heading">
        <h4 id="forumQuickReplyTitle">快捷回复</h4>
        <span><output id="forumReplyBodyCount" for="forumReplyBody">0 / 50,000</output> · <span id="forumReplyPreviewStatus" role="status" aria-live="polite">预览已同步</span></span>
      </div>

      <div class="forum-composer-tabs" id="forumReplyEditorTabs" role="tablist" aria-label="回复编辑模式">
        <button id="forumReplyEditTab" type="button" role="tab" aria-selected="true" aria-controls="forumReplyEditorPanel" data-editor-tab="edit">编辑</button>
        <button id="forumReplyPreviewTab" type="button" role="tab" aria-selected="false" aria-controls="forumReplyPreviewPanel" data-editor-tab="preview" tabindex="-1">预览</button>
      </div>

      <div class="reply-markdown-toolbar" aria-label="Markdown 格式工具栏">
        <span class="forum-toolbar-group"><button type="button" data-md="bold" aria-label="加粗"><strong>B</strong></button><button type="button" data-md="italic" aria-label="斜体"><em>I</em></button></span>
        <span class="forum-toolbar-group"><button type="button" data-md="quote" aria-label="引用">引用</button><button type="button" data-md="inline-code" aria-label="行内代码">代码</button></span>
        <span class="forum-toolbar-group"><button type="button" data-md="link" aria-label="插入链接">链接</button><button type="button" data-md="image" aria-label="上传并插入图片">图片</button></span>
      </div>

      <div class="forum-reply-target" id="forumReplyTarget" hidden></div>

      <div class="forum-reply-composer">
        <div class="forum-composer-panel is-active" id="forumReplyEditorPanel" role="tabpanel" aria-labelledby="forumReplyEditTab">
          <label class="forum-sr-only" for="forumReplyVisualEditor">回复内容</label>
          <div id="forumReplyVisualEditor" class="forum-rich-editor forum-reply-rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="回复写作区" data-placeholder="写下你的回复，支持 @提及…"></div>
          <textarea id="forumReplyBody" maxlength="50000" placeholder="写下你的回复，支持 @提及…" hidden aria-hidden="true"></textarea>
        </div>
        <div class="forum-composer-panel" id="forumReplyPreviewPanel" role="tabpanel" aria-labelledby="forumReplyPreviewTab" aria-hidden="true">
          <div class="forum-markdown-preview forum-markdown-preview--compact post-content" id="forumReplyPreview">
            <div class="forum-preview-empty"><strong>回复预览会显示在这里</strong><span>使用工具栏或直接输入 Markdown。</span></div>
          </div>
        </div>
      </div>
      <input type="hidden" id="forumReplyParent" value="">
      <div class="forum-reply-upload-zone" id="forumReplyUpload">点击、拖拽或粘贴图片，选择后会立即显示缩略图。</div>
      <div class="reply-toolbar">
        <span class="hint">选中文本可快捷引用；发送失败时会保留当前内容。</span>
        <button type="button" id="forumReplySubmit">发送回复</button>
      </div>
    </section>
