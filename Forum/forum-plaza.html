  <style>
    :root {
      --font-display: 'Noto Serif SC', 'STZhongsong', 'SimSun', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Microsoft YaHei', system-ui, sans-serif;
      --ease-spring:  cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out:     cubic-bezier(0.16, 1, 0.3, 1);
      --forum-sidebar: 220px;
      --forum-gap: 24px;
      --primary: var(--md-primary, #e74c3c);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    [data-theme="light"] { color-scheme: light; }

    body {
      min-height: 100vh;
      background: var(--md-surface-container, #0a0c18);
      color: var(--md-on-surface, #dddae4);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* Background aurora */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 5%,  rgba(231,76,60,0.07), transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(104,152,208,0.05), transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(78,168,158,0.04), transparent 50%);
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: rgba(8,10,22,0.78);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .topbar-brand {
      font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--md-on-surface, #dddae4);
    }
    .topbar-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
      border-radius: 8px; background: var(--md-surface, #121424);
      color: var(--md-on-surface-variant, #8c88a4); font-size: 13px; font-weight: 500;
      transition: all 0.18s ease;
    }
    .topbar-btn:hover {
      border-color: var(--md-outline, rgba(255,255,255,0.14)); color: var(--md-on-surface, #dddae4);
    }
    .topbar-btn.primary { background: rgba(231,76,60,0.12); color: var(--primary); border-color: rgba(231,76,60,0.2); }
    .topbar-btn.primary:hover { background: rgba(231,76,60,0.18); }
    .topbar-search {
      position: relative; display: flex; align-items: center;
    }
    .topbar-search input {
      width: 220px; padding: 6px 10px 6px 30px; border-radius: 8px;
      border: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
      background: var(--md-surface, #121424); color: var(--md-on-surface, #dddae4);
      font-size: 13px; outline: none;
    }
    .topbar-search svg {
      position: absolute; left: 8px; pointer-events: none;
      color: var(--md-on-surface-variant, #8c88a4);
    }
    .notice-bell {
      position: relative; width: 36px; height: 36px; display: grid; place-items: center;
      border: 1px solid var(--md-outline-variant); border-radius: 8px; background: var(--md-surface);
      color: var(--md-on-surface-variant);
    }
    .notice-bell .badge {
      position: absolute; top: -3px; right: -3px;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--primary); color: #fff; border-radius: 8px;
      font-size: 11px; font-weight: 700; line-height: 16px; text-align: center;
    }

    /* Layout */
    .forum-shell {
      max-width: 1320px; margin: 0 auto; padding: 24px 28px 48px;
      display: grid; grid-template-columns: var(--forum-sidebar) 1fr; gap: var(--forum-gap);
    }

    /* Sidebar */
    .forum-sidebar {
      position: sticky; top: 72px; align-self: start;
      display: flex; flex-direction: column; gap: 16px;
    }
    .sidebar-card {
      background: var(--md-surface, rgba(18,20,36,0.88));
      border: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
      border-radius: 12px; overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px; font-family: var(--font-display); font-size: 14px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--md-on-surface, #dddae4);
      border-bottom: 1px solid var(--md-outline-variant);
    }
    .nav-list { list-style: none; }
    .nav-item { position: relative; }
    .nav-item a, .nav-item button {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 16px; border: none; background: transparent;
      color: var(--md-on-surface-variant, #8c88a4); font-size: 14px; text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item a:hover, .nav-item button:hover { background: var(--md-surface-container-high, rgba(24,26,46,0.92)); color: var(--md-on-surface); }
    .nav-item.active a, .nav-item.active button { color: var(--primary); background: rgba(231,76,60,0.08); }
    .nav-item .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .nav-item .dot.red { background: var(--primary); }
    .nav-item .dot.moe { background: #c07ab8; }
    .nav-item .dot.twelve { background: #6898d0; }
    .nav-item .dot.radar { background: #4ea89e; }
    .nav-item .count {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--md-surface-muted, #2c2c2e); color: var(--md-on-surface-variant);
      font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
    }

    /* Main */
    .forum-main { min-width: 0; }

    /* Tabs */
    .forum-tabs {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .tab {
      padding: 6px 14px; border-radius: 8px; border: 1px solid transparent;
      background: transparent; color: var(--md-on-surface-variant, #8c88a4);
      font-size: 13px; font-weight: 500; transition: all 0.18s ease;
    }
    .tab:hover { color: var(--md-on-surface); }
    .tab.active { background: var(--md-surface, #121424); color: var(--primary); border-color: var(--md-outline-variant); }

    /* Sort / tools */
    .forum-tools {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 12px;
    }
    .sort-group { display: flex; align-items: center; gap: 6px; }
    .sort-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--md-on-surface-variant); font-size: 13px;
    }
    .sort-btn.active { background: var(--md-surface); color: var(--md-on-surface); border-color: var(--md-outline-variant); }
    .btn-post {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
      transition: transform 0.15s var(--ease-spring), background 0.15s ease;
    }
    .btn-post:hover { transform: translateY(-1px); filter: brightness(1.05); }

    /* Post list */
    .post-list { display: flex; flex-direction: column; gap: 8px; }
    .post-row {
      display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 14px;
      padding: 14px 18px;
      background: var(--md-surface, rgba(18,20,36,0.88));
      border: 1px solid var(--md-outline-variant, rgba(255,255,255,0.08));
      border-radius: 12px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s var(--ease-spring);
    }
    .post-row:hover { border-color: var(--md-outline); transform: translateY(-1px); }
    .post-row.pinned { background: var(--md-surface-container-high, rgba(24,26,46,0.92)); border-color: rgba(231,76,60,0.18); }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--md-surface-muted); }
    .post-avatar.small { width: 32px; height: 32px; }
    .post-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .post-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .post-title {
      font-size: 15px; font-weight: 600; color: var(--md-on-surface, #dddae4);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .post-row:hover .post-title { color: var(--primary); }
    .post-pill {
      flex-shrink: 0; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600;
      background: var(--md-surface-muted, #2c2c2e); color: var(--md-on-surface-variant);
    }
    .post-pill.category { background: rgba(255,255,255,0.08); }
    .post-meta { display: flex; align-items: center; gap: 10px; color: var(--md-on-surface-variant); font-size: 12px; }
    .post-meta .sep { color: var(--md-outline); }
    .post-stats {
      display: flex; align-items: center; gap: 12px;
      color: var(--md-on-surface-variant); font-size: 13px; white-space: nowrap;
    }
    .post-stats span { display: inline-flex; align-items: center; gap: 4px; }
    .pin-icon { color: var(--primary); }

    /* Pagination */
    .pagination {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: 24px;
    }
    .pagination a, .pagination span {
      min-width: 32px; height: 32px; display: inline-grid; place-items: center;
      padding: 0 8px; border-radius: 8px; border: 1px solid transparent;
      font-size: 13px; color: var(--md-on-surface-variant);
    }
    .pagination a { background: var(--md-surface); border-color: var(--md-outline-variant); }
    .pagination a:hover { color: var(--md-on-surface); border-color: var(--md-outline); }
    .pagination span.current { background: var(--primary); color: #fff; }

    /* Footer stats */
    .forum-footer {
      margin-top: 28px; padding-top: 18px;
      border-top: 1px solid var(--md-outline-variant);
      display: flex; flex-wrap: wrap; gap: 16px;
      color: var(--md-on-surface-variant); font-size: 12px;
    }
    .forum-footer a:hover { color: var(--primary); }

    /* Responsive */
    @media (max-width: 980px) {
      .forum-shell { grid-template-columns: 1fr; padding: 16px; }
      .forum-sidebar { display: none; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 10px 16px; flex-wrap: wrap; }
      .topbar-search input { width: 140px; }
      .post-row { grid-template-columns: 32px 1fr; gap: 10px; padding: 12px; }
      .post-stats { grid-column: 2; justify-self: start; font-size: 12px; }
      .post-avatar { width: 32px; height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }

    /* Shared VNFest header layout: keep every forum control on one row. */
    .topbar.forum-topbar.vn-topbar {
      min-width: 0;
      align-items: center;
      flex-wrap: nowrap !important;
      gap: clamp(4px, 1vw, 16px);
    }
    .topbar.forum-topbar.vn-topbar .forum-topbar-leading {
      min-width: 0;
      flex: 0 1 auto !important;
      width: auto !important;
    }
    .topbar.forum-topbar.vn-topbar .vn-topbar-brand {
      min-height: 40px;
    }
    .topbar.forum-topbar.vn-topbar .forum-topbar-actions {
      display: flex !important;
      min-width: 0;
      width: auto !important;
      flex: 1 1 auto !important;
      max-width: none;
      flex-wrap: nowrap !important;
      gap: clamp(4px, .6vw, 10px);
    }
    .topbar.forum-topbar.vn-topbar .topbar-search {
      min-width: 0;
      flex: 1 1 220px;
    }
    .topbar.forum-topbar.vn-topbar .topbar-search input {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 40px;
    }
    .topbar.forum-topbar.vn-topbar .notice-bell,
    .topbar.forum-topbar.vn-topbar .theme-toggle,
    .topbar.forum-topbar.vn-topbar .forum-map-link {
      flex: 0 0 auto;
      min-height: 40px;
    }
    @media (max-width: 680px) {
      .topbar.forum-topbar.vn-topbar {
        align-items: center;
        gap: 4px;
        padding: 8px;
      }
      .topbar.forum-topbar.vn-topbar .forum-topbar-leading,
      .topbar.forum-topbar.vn-topbar .forum-topbar-actions {
        box-sizing: border-box;
        flex-basis: auto !important;
        width: auto !important;
      }
      .topbar.forum-topbar.vn-topbar .forum-topbar-actions {
        justify-content: flex-end;
        margin-left: 0;
      }
      .topbar.forum-topbar.vn-topbar .topbar-search {
        flex: 1 1 132px;
      }
      .topbar.forum-topbar.vn-topbar .vn-topbar-brand {
        min-height: 44px;
      }
      .topbar.forum-topbar.vn-topbar .topbar-search input {
        width: 100%;
        min-height: 44px;
        padding-right: 6px;
      }
      .topbar.forum-topbar.vn-topbar .notice-bell,
      .topbar.forum-topbar.vn-topbar .theme-toggle,
      .topbar.forum-topbar.vn-topbar .forum-map-link {
        min-height: 44px;
      }
      .topbar.forum-topbar.vn-topbar .forum-map-link {
        margin-left: auto;
      }
    }
    @media (max-width: 420px) {
      .topbar.forum-topbar.vn-topbar .vn-topbar-brand {
        max-width: 112px;
      }
      .topbar.forum-topbar.vn-topbar .vn-topbar-sub {
        font-size: 12px;
      }
      .topbar.forum-topbar.vn-topbar .vn-topbar-divider {
        margin-left: 8px;
        margin-right: 8px;
      }
      .topbar.forum-topbar.vn-topbar .topbar-search input {
        padding-left: 26px;
      }
    }
  </style>
