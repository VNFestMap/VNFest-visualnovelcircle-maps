<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同好会考核 - Galgame 同好会地图</title>
  <link rel="stylesheet" href="../css/site-header.css?v=20260829-recognition" />
  <script defer src="../js/site-header.js?v=20260829-recognition"></script>
  <link rel="stylesheet" href="exam.css?v=20260829-recognition" />
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="brand" href="../index.html">Galgame 同好会地图</a>
      <nav>
        <a href="../index.html">地图</a>
        <a href="../club_square.html">同好会广场</a>
        <a href="index.html">同好会考核</a>
        <a href="../verify.html">凭证验证</a>
        <a href="../user.html?tab=achievements">我的成就</a>
        <a href="../user.html">个人中心</a>
      </nav>
    </div>

    <header class="hero">
      <div>
        <p class="kicker">同好会考核 · Club Assessments</p>
        <h1 class="page-title">通过考核，获得来自真实同好会的认可</h1>
        <p class="lead">同好会可以发布自己的考核与活动。完成条件后，你将获得由对应同好会签发的网络成就徽章，统一保存在你的个人成就中。</p>
      </div>
      <div class="hero-side" id="login-state">
        <a class="btn btn-primary" href="../login.html">登录后可参与考核</a>
      </div>
    </header>

    <!-- 视图：考核广场 -->
    <section id="view-list" class="view">
      <div class="toolbar">
        <div class="filter-group" id="type-filter">
          <button class="chip active" data-type="">全部</button>
          <button class="chip" data-type="assessment">知识考核</button>
          <button class="chip" data-type="activity">活动签到</button>
          <button class="chip" data-type="submission">作品提交</button>
          <button class="chip" data-type="award">人工授予</button>
        </div>
        <button class="btn btn-ghost" id="manage-entry" hidden>管理我的同好会考核</button>
      </div>
      <div class="filter-note" id="club-filter-note" hidden></div>
      <div id="program-list" class="card-grid" aria-live="polite"></div>
    </section>

    <!-- 视图：考核详情与参与 -->
    <section id="view-detail" class="view" hidden>
      <button class="btn btn-ghost" id="back-to-list">&larr; 返回考核广场</button>
      <div id="detail-body"></div>
    </section>

    <!-- 视图：答题 -->
    <section id="view-quiz" class="view" hidden>
      <div id="quiz-body"></div>
    </section>

    <footer class="foot">
      徽章由对应同好会签发，可在 <a href="../verify.html">凭证验证页</a> 核验来源。
    </footer>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="exam.js?v=20260829-recognition"></script>
</body>
</html>
