<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同好会考核 - Galgame 同好会地图</title>
  <script src="../js/theme-runtime.js?v=20260830-exam-redesign"></script>
  <link rel="stylesheet" href="../css/site-header.css?v=20260830-exam-redesign" />
  <script defer src="../js/site-header.js?v=20260830-exam-redesign"></script>
  <link rel="stylesheet" href="../css/galonly-poster-theme.css?v=20260830-exam-redesign" />
  <link rel="stylesheet" href="exam.css?v=20260830-exam-redesign" />
<script defer src="../js/analytics.js?v=20260905-analytics"></script>
</head>
<body>
  <div class="exam-topbar-wrap">
    <header class="vn-topbar" data-page-header data-header-manual>
      <div class="vn-topbar-leading">
        <a class="vn-topbar-brand" href="../index.html" aria-label="返回地图">
          <span class="vn-topbar-name">VNFest</span>
          <span class="vn-topbar-divider" aria-hidden="true"></span>
          <span class="vn-topbar-sub">同好会考核</span>
        </a>
      </div>
      <nav class="vn-topbar-actions" aria-label="页面导航">
        <a class="toplink" href="../club_square.html">活动</a>
        <a class="toplink" href="../verify.html">凭证验证</a>
        <span id="login-state"><a class="btn btn-primary btn-sm" href="../login.html">登录</a></span>
      </nav>
    </header>
  </div>

  <main class="shell">
    <header class="hero">
      <h1 class="page-title">同好会考核</h1>
      <p class="lead">各同好会在这里发布知识考核、活动签到和作品征集。完成考核即可获得对应同好会签发的徽章，统一保存在你的成就里。</p>
    </header>

    <!-- 视图：考核列表 -->
    <section id="view-list" class="view">
      <div class="toolbar">
        <div class="filter-group" id="type-filter">
          <button class="chip active" data-type="">全部</button>
          <button class="chip" data-type="assessment">知识考核</button>
          <button class="chip" data-type="activity">活动签到</button>
          <button class="chip" data-type="submission">作品提交</button>
          <button class="chip" data-type="award">人工授予</button>
        </div>
        <button class="btn btn-ghost" id="manage-entry" hidden>管理我的同好会考核</button>
      </div>
      <div class="filter-note" id="club-filter-note" hidden></div>
      <div id="program-list" class="card-grid" aria-live="polite"></div>
    </section>

    <!-- 视图：考核详情与参与 -->
    <section id="view-detail" class="view" hidden>
      <button class="btn btn-ghost" id="back-to-list">&larr; 返回考核列表</button>
      <div id="detail-body"></div>
    </section>

    <!-- 视图：答题 -->
    <section id="view-quiz" class="view" hidden>
      <div id="quiz-body"></div>
    </section>

    <footer class="foot">
      徽章由对应同好会签发，可在 <a href="../verify.html">凭证验证页</a> 核验来源。
    </footer>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="../js/vendor/qrcode.min.js?v=20260830-qr"></script>
  <script src="exam.js?v=20260831-exam-scoring"></script>
</body>
</html>
