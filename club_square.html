<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script defer src="./js/language-runtime.js"></script>
    <script defer src="./js/language-catalog.js"></script>
    <script defer src="./js/language-static-ja.js"></script>
    <title>活动 · VNFest</title>
    <script>
      fetch('./api/posts.php?action=bootstrap', { credentials: 'same-origin' })
        .then(function (response) { return response.json(); })
        .then(function (payload) {
          var access = payload && payload.data && payload.data.space_access;
          if (access && access.allowed) {
            window.location.replace('./column/?tab=activity');
            return;
          }
          var message = document.getElementById('spaceGateMessage');
          var link = document.getElementById('spaceGateLink');
          if (access && access.reason === 'login_required') {
            if (message) message.textContent = '登录后即可进入同好会空间。';
            if (link) {
              link.textContent = '登录 / 注册';
              link.href = './login.html?redirect=' + encodeURIComponent('./club_square.html');
            }
          } else if (message) {
            message.textContent = '空间仅对成员及以上身份开放。';
          }
        })
        .catch(function () {
          var message = document.getElementById('spaceGateMessage');
          if (message) message.textContent = '空间权限暂时无法确认，请稍后重试。';
        });
    </script>
  </head>
  <body>
    <main>
      <h1>活动</h1>
      <p id="spaceGateMessage">正在确认空间访问权限…</p>
      <p><a id="spaceGateLink" href="./index.html?guest=1">返回地图</a></p>
    </main>
  </body>
</html>
