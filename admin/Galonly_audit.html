async function undoResolve(applicationId, phase) {
  var backTo = phase === 1 ? '待审核' : '制品审核中';
  if (!confirm('确定撤回该申请阶段' + (phase === 1 ? '一' : '二') + '的「通过」？申请将回到「' + backTo + '」状态，摊主可重新修改/重新审核。')) return;
  try {
    var r = await fetch('../api/galonly.php?action=undo_resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ application_id: applicationId, phase: phase })
    });
    var data = await r.json();
    if (!data.success) {
      showToast(data.message || '撤回失败', 'error');
      return;
    }
    showToast(data.message || '已撤回', 'success');
    await loadApplications();
  } catch (e) {
    showToast('网络错误，撤回失败', 'error');
  }
}

// ====== Image Modal ======
function openImageModal(src) {
  var img = document.getElementById('previewImage');
  img.src = src;
  var downloadBtn = document.getElementById('downloadImageBtn');
  if (downloadBtn) downloadBtn.href = src;
  document.getElementById('imageModal').style.display = 'flex';
}

function closeImageModal() {
  document.getElementById('imageModal').style.display = 'none';
  document.getElementById('previewImage').src = '';
}

// ====== Event Filters (moved to sidebar: selectSidebarEvent) ======

function syncStaffModeTitle() {
  var title = document.getElementById('staffModeTitle');
  if (!title) return;
  var eventName = null;
  if (selectedStaffEventId > 0) {
    for (var i = 0; i < allEvents.length; i++) {
      if (parseInt(allEvents[i].id, 10) === selectedStaffEventId) {
        eventName = allEvents[i].title || allEvents[i].name || '';
        break;
      }
    }
  }
  title.textContent = eventName ? '工作人员审核 · ' + eventName : '工作人员审核 · 全部活动';
}

// ====== Tab Switch ======
function switchBoothTab(tab) {
  currentBoothTab = tab;
  buildBoothTabBar();
  renderBoothCurrentTab();
}

function switchStaffTab(tab) {
  currentStaffTab = tab;
  document.querySelectorAll('#staffTabBar .tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  renderStaffCurrentTab();
}

// ====== Booth Event Management ======
function toggleEventMgr() {
  var body = document.getElementById('eventMgrBody');
  var arrow = document.getElementById('eventMgrArrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function renderEventMgr() {
  var list = document.getElementById('eventMgrList');
  var count = document.getElementById('eventMgrCount');
  if (!allEvents || allEvents.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">暂无活动</div>';
    if (count) count.textContent = '';
    return;
  }
  if (count) count.textContent = allEvents.length + ' 个活动';
  list.innerHTML = allEvents.map(function(ev) {
    var isOpen = ev.registration_open == 1;
    var name = escapeHtml(ev.name || ev.title || '未命名');
    var dateStr = ev.date || '';
    var dateValue = ev.date ? String(ev.date).slice(0, 10) : '';
    var statusHtml = isOpen
      ? '<span class="app-status-badge app-status-approved">开放申请</span>'
      : '<span class="app-status-badge app-status-rejected">已熔断</span>';
    var btnHtml = isOpen
      ? '<button onclick="toggleRegistration(' + ev.id + ',1)" class="btn-single-vote reject" style="font-size:12px;padding:4px 12px;">熔断</button>'
      : '<button onclick="toggleRegistration(' + ev.id + ',0)" class="btn-single-vote approve" style="font-size:12px;padding:4px 12px;">重新开放</button>';
    return '<div class="staff-config-row">' +
      '<div class="staff-config-info">' +
        '<div class="staff-config-name">' + name + '</div>' +
        '<div class="staff-config-date">' + escapeHtml(dateStr) + '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<input type="date" class="config-input" value="' + dateValue + '" data-event-date="' + ev.id + '" aria-label="活动日期" style="width:150px;">' +
        '<button class="btn-config-save" onclick="saveEventDate(' + ev.id + ', this)">保存日期</button>' +
        statusHtml + btnHtml +
      '</div>' +
    '</div>';
  }).join('');
}

async function saveEventDate(eventId, btn) {
  var input = document.querySelector('[data-event-date="' + eventId + '"]');
  if (!input || !input.value) {
    showToast('请先选择日期', 'error');
    return;
  }
  btn.disabled = true;
  try {
    var r = await fetch('../api/galonly.php?action=update_event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ event_id: eventId, date: input.value })
    });
    var data = await r.json();
    if (!data.success) {
      showToast(data.message || '保存失败', 'error');
      return;
    }
    showToast('活动日期已更新', 'success');
    await loadEvents();
    renderEventMgr();
  } catch (e) {
    showToast('网络错误，保存失败', 'error');
  } finally {
    btn.disabled = false;
  }
}

async function toggleRegistration(eventId, currentlyOpen) {
  var msg = currentlyOpen
    ? '确定要熔断此活动吗？熔断后用户将看到「摊位申请已达到上限」。'
    : '确定要重新开放此活动的申请入口吗？';
  if (!confirm(msg)) return;
  try {
    var r = await fetch('../api/galonly.php?action=update_event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ event_id: eventId, registration_open: currentlyOpen ? 0 : 1 })
    });
    var data = await r.json();
    if (!data.success) {
      showToast(data.message || '操作失败', 'error');
      return;
    }
    showToast((currentlyOpen ? '熔断' : '重新开放') + '成功', 'success');
    await loadEvents();
    renderEventMgr();
  } catch (e) {
    showToast('网络错误，操作失败', 'error');
  }
}

// ====== Init ======
async function init() {
  var authorized = await checkAuth();
  if (!authorized) return;
  await loadClubNames();
  await loadEvents();
  renderEventMgr();
  buildBoothTabBar();
  selectSidebarEvent('all');
  await loadApplications();
  await loadStaffApplications();
}

document.getElementById('modeSwitch').addEventListener('click', function(e) {
  var btn = e.target.closest('.mode-btn');
  if (btn) switchMode(btn.dataset.mode);
});

document.getElementById('boothTabBar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab-btn');
  if (btn) switchBoothTab(btn.dataset.tab);
});

document.getElementById('staffTabBar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab-btn');
  if (btn) switchStaffTab(btn.dataset.tab);
});

document.getElementById('imageModal').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeImageModal();
});

// ====== Theme Toggle ======
function toggleTheme() {
  var html = document.documentElement;
  var current = html.getAttribute('data-theme') || 'dark';
  var next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('galonly-theme', next); } catch(e) {}
  updateThemeIcon(next);
}

function updateThemeIcon(theme) {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.textContent = theme === 'dark' ? '\u263E' : '\u2600';
}

// Restore saved theme on load
(function() {
  try {
    var saved = localStorage.getItem('galonly-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
  // Set icon after DOM ready
  document.addEventListener('DOMContentLoaded', function() {
    updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');
  });
})();

// ====== Viewport Zoom (内页缩放) ======
var viewportZoomStates = {};

function initViewportZoom(wrapEl) {
  if (!wrapEl) return;
  var table = wrapEl.querySelector('table');
  if (!table) return;

  var id = wrapEl.className + '-' + (wrapEl.closest('[id]') ? wrapEl.closest('[id]').id : 'x');
  var state = viewportZoomStates[id] || { scale: 1 };
  viewportZoomStates[id] = state;

  // Remove existing controls if any
  var existing = wrapEl.querySelector('.viewport-zoom-controls');
  if (existing) existing.remove();

  // Create controls
  var controls = document.createElement('div');
  controls.className = 'viewport-zoom-controls';
  controls.innerHTML =
    '<button class="zoom-btn" data-dir="out" title="缩小">−</button>' +
    '<span class="zoom-label">' + Math.round(state.scale * 100) + '%</span>' +
    '<button class="zoom-btn" data-dir="in" title="放大">+</button>' +
    '<button class="zoom-btn" data-dir="reset" title="重置" style="font-size:12px;">↺</button>' +
    '<span class="zoom-hint">Ctrl + 滚轮缩放</span>';

  // Insert controls at the top of the wrap, before the table
  wrapEl.insertBefore(controls, wrapEl.firstChild);

  var label = controls.querySelector('.zoom-label');

  function applyZoom(newScale) {
    newScale = Math.round(newScale * 10) / 10;
    newScale = Math.max(0.5, Math.min(2.0, newScale));
    state.scale = newScale;
    table.style.transform = 'scale(' + newScale + ')';
    table.style.transformOrigin = 'top left';
    table.style.width = (100 / newScale) + '%';
    label.textContent = Math.round(newScale * 100) + '%';
  }

  // Button clicks
  controls.addEventListener('click', function(e) {
    var btn = e.target.closest('.zoom-btn');
    if (!btn) return;
    var dir = btn.dataset.dir;
    if (dir === 'in') applyZoom(state.scale + 0.1);
    else if (dir === 'out') applyZoom(state.scale - 0.1);
    else if (dir === 'reset') applyZoom(1);
  });

  // Ctrl + wheel zoom
  wrapEl.addEventListener('wheel', function(e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.1 : 0.1;
    applyZoom(state.scale + delta);
  }, { passive: false });

  // Touch pinch zoom
  var touchState = { dist: 0, scale: 1 };
  wrapEl.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      touchState.dist = Math.sqrt(dx * dx + dy * dy);
      touchState.scale = state.scale;
    }
  }, { passive: true });

  wrapEl.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (touchState.dist > 0) {
        var ratio = dist / touchState.dist;
        applyZoom(touchState.scale * ratio);
      }
    }
  }, { passive: false });

  // Apply saved zoom state
  if (state.scale !== 1) applyZoom(state.scale);
}

// ====== Start ======
init();
</script>
