// ====== Recommendation Board ======

let recSearchResults = [];
let recHasSearched = false;
let recData = [];
const REC_SLOT_COUNT = 12;
let recSlots = Array(REC_SLOT_COUNT).fill(null);
let recTargetSlot = null;
let recMovingSlot = null;
let recDraggedSlot = null;
let recReorderBusy = false;
let moeKingData = null;
let moeKingSearchResults = [];
let moeKingHasSearched = false;

function firstEmptyRecommendationSlot(slots = recSlots) {
  return slots.findIndex(item => !item);
}

function buildRecommendationSlots() {
  const slots = Array(REC_SLOT_COUNT).fill(null);
  recData.forEach((rec, index) => {
    const requestedSlot = Number(rec.sort_order);
    const preferredSlot = Number.isInteger(requestedSlot) && requestedSlot >= 0 && requestedSlot < REC_SLOT_COUNT
      ? requestedSlot
      : -1;
    const slot = preferredSlot >= 0 && !slots[preferredSlot]
      ? preferredSlot
      : firstEmptyRecommendationSlot(slots);
    if (slot >= 0) slots[slot] = rec;
  });
  return slots;
}

function updateRecommendationSlotSelection() {
  if (recMovingSlot !== null && !recSlots[recMovingSlot]) recMovingSlot = null;
  if (recTargetSlot === null || recTargetSlot < 0 || recTargetSlot >= REC_SLOT_COUNT || recSlots[recTargetSlot]) {
    const firstEmpty = firstEmptyRecommendationSlot();
    recTargetSlot = firstEmpty >= 0 ? firstEmpty : null;
  }
}

function recommendationSlotsPayload(slots) {
  return slots.map(item => item ? Number(item.id) : null);
}

function selectRecommendationTarget(slot) {
  if (recMovingSlot !== null) {
    if (recMovingSlot === slot) return cancelRecommendationMove();
    return moveRecommendationSlot(recMovingSlot, slot);
  }
  if (recSlots[slot]) {
    recMovingSlot = slot;
    recTargetSlot = null;
    renderRecommendationBoardState();
    showToast(`已选中第 ${slot + 1} 位，请点击目标位置`, 'info');
    return;
  }
  recTargetSlot = slot;
  renderRecommendationBoardState();
}

function cancelRecommendationMove() {
  if (recMovingSlot === null) return;
  recMovingSlot = null;
  updateRecommendationSlotSelection();
  renderRecommendationBoardState();
}

function renderRecommendationBoardState() {
  const list = document.querySelector('.rec-list');
  if (!list) return;
  list.querySelectorAll('[data-rec-slot]').forEach(card => {
    const slot = Number(card.dataset.recSlot);
    card.classList.toggle('rec-card-moving', recMovingSlot === slot);
    card.classList.toggle('rec-card-target', recMovingSlot === null && recTargetSlot === slot && !recSlots[slot]);
    card.classList.remove('rec-card-drop-target');
    if (card.classList.contains('rec-card-empty')) {
      card.setAttribute('aria-pressed', recMovingSlot === null && recTargetSlot === slot ? 'true' : 'false');
    } else {
      card.setAttribute('aria-pressed', recMovingSlot === slot ? 'true' : 'false');
    }
  });
  const status = document.getElementById('recSlotStatus');
  if (!status) return;
  if (recMovingSlot !== null) {
    status.innerHTML = `正在移动第 <strong>${recMovingSlot + 1}</strong> 位：点击空槽移动，或点击其他条目互换；按 Esc 取消`;
  } else if (recTargetSlot !== null) {
    status.innerHTML = `新增目标：第 <strong>${recTargetSlot + 1}</strong> 位空槽`;
  } else {
    status.textContent = '推荐榜已填满，可拖拽或点击条目互换位置';
  }
}

function bindRecommendationBoardInteractions() {
  const list = document.querySelector('.rec-list');
  if (!list) return;

  list.addEventListener('click', event => {
    if (event.target.closest('.remove-btn')) return;
    const card = event.target.closest('[data-rec-slot]');
    if (!card) return;
    selectRecommendationTarget(Number(card.dataset.recSlot));
  });

  list.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      cancelRecommendationMove();
      return;
    }
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const card = event.target.closest('[data-rec-slot]');
    if (!card) return;
    event.preventDefault();
    selectRecommendationTarget(Number(card.dataset.recSlot));
  });

  list.addEventListener('dragstart', event => {
    const card = event.target.closest('[data-rec-slot]:not(.rec-card-empty)');
    if (!card || recReorderBusy) return;
    recDraggedSlot = Number(card.dataset.recSlot);
    card.classList.add('rec-card-moving');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', String(recDraggedSlot));
  });

  list.addEventListener('dragover', event => {
    const card = event.target.closest('[data-rec-slot]');
    if (!card || recDraggedSlot === null || recReorderBusy) return;
    event.preventDefault();
    card.classList.add('rec-card-drop-target');
    event.dataTransfer.dropEffect = 'move';
  });

  list.addEventListener('dragleave', event => {
    const card = event.target.closest('[data-rec-slot]');
    if (card && !card.contains(event.relatedTarget)) card.classList.remove('rec-card-drop-target');
  });

  list.addEventListener('drop', event => {
    const card = event.target.closest('[data-rec-slot]');
    if (!card || recDraggedSlot === null) return;
    event.preventDefault();
    const targetSlot = Number(card.dataset.recSlot);
    list.querySelectorAll('.rec-card-drop-target').forEach(item => item.classList.remove('rec-card-drop-target'));
    moveRecommendationSlot(recDraggedSlot, targetSlot);
  });

  list.addEventListener('dragend', () => {
    recDraggedSlot = null;
    list.querySelectorAll('.rec-card-drop-target').forEach(item => item.classList.remove('rec-card-drop-target'));
  });
  renderRecommendationBoardState();
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') cancelRecommendationMove();
});

async function moveRecommendationSlot(fromSlot, toSlot) {
  if (fromSlot === toSlot || recReorderBusy || !recSlots[fromSlot]) return;
  const nextSlots = recSlots.slice();
  const source = nextSlots[fromSlot];
  nextSlots[fromSlot] = nextSlots[toSlot] || null;
  nextSlots[toSlot] = source;
  const previousSlots = recSlots;
  recSlots = nextSlots;
  recMovingSlot = null;
  recTargetSlot = null;
  recReorderBusy = true;
  try {
    const response = await fetch('../api/club_recommendations.php?action=reorder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ slots: recommendationSlotsPayload(nextSlots) })
    });
    const data = await response.json();
    if (!data.success) throw new Error(data.message || '排序保存失败');
    showToast('推荐榜排序已保存', 'success');
    await renderRecommendations();
  } catch (error) {
    recSlots = previousSlots;
    updateRecommendationSlotSelection();
    showToast(error.message || '排序保存失败，请稍后重试', 'error');
    renderRecommendationBoardState();
  } finally {
    recReorderBusy = false;
  }
}

async function renderRecommendations() {
  const container = document.getElementById('listContainer');
  if (!selectedClubId || selectedClubId <= 0) {
    container.innerHTML = emptyHtml('pointer', '请先在上方选择一个同好会');
    return;
  }

  const savedSearch = document.getElementById('recSearchInput')?.value || '';

  // Load current recommendations from server
  try {
    const r = await fetch(`../api/club_recommendations.php?action=list&club_id=${selectedClubId}&country=${selectedCountry}`, { credentials: 'same-origin' });
    const data = await r.json();
    recData = data.success ? (data.data || []) : [];
  } catch { recData = []; }
  try {
    const r = await fetch(`../api/club_moe_king.php?action=get&club_id=${selectedClubId}&country=${selectedCountry}`, { credentials: 'same-origin' });
    const data = await r.json();
    moeKingData = data.success ? data.data : null;
  } catch { moeKingData = null; }

  recSlots = buildRecommendationSlots();
  updateRecommendationSlotSelection();
  let html = '<div class="rec-layout">';

  // Left: Search panel
  html += `<div class="section-card">
    <div class="section-title">${icon('search')} 搜索 Bangumi</div>
    <div class="search-area">
      <div class="search-input-wrap">
        <input type="text" id="recSearchInput" class="form-input" placeholder="搜索游戏名称…" style="min-width:0;flex:1;max-width:200px;" onkeydown="if(event.key==='Enter') searchBangumi()">
        <button class="btn btn-primary" onclick="searchBangumi()">搜索</button>
      </div>
      <div class="search-results" id="recSearchResults">`;

  if (recSearchResults.length === 0) {
    html += '<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px;">' +
      (recHasSearched ? '未找到相关结果' : '输入关键词搜索 Bangumi 上的游戏作品') +
      '</div>';
  } else {
    recSearchResults.forEach(item => {
      const alreadyAdded = recData.some(r => r.bangumi_id === item.bangumi_id);
      const title = item.title_cn || item.title;
      const rating = item.rating ? '评分 ' + item.rating : '';
      const date = item.air_date || item.date || '';
      html += `<div class="search-item">
        <div class="thumb">${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="" onerror="this.style.display='none'">` : icon('gamepad')}</div>
        <div class="item-info">
          <div class="item-title">${escapeHtml(title)}</div>
          <div class="item-sub">${rating}${rating && date ? ' · ' : ''}${escapeHtml(date)}</div>
        </div>`;
      if (alreadyAdded) {
        html += '<span style="font-size:11px;color:var(--text-muted);flex-shrink:0;">已添加</span>';
      } else {
        const targetText = recTargetSlot !== null ? `第 ${recTargetSlot + 1} 位` : '首个空位';
        html += `<button class="add-btn" onclick="addRecommendation(${item.bangumi_id})">+ 添加到${targetText}</button>`;
      }
      html += '</div>';
    });
  }

  html += `</div></div></div>`; // close search-results, search-area, card

  // Right: Current fixed 12-slot recommendation list
  const filledCount = recSlots.filter(Boolean).length;
  html += `<div class="section-card">
    <div class="section-title">${icon('star')} 当前推荐榜 <span style="font-size:12px;color:var(--text-muted);font-weight:400;">(${filledCount} / 12)</span></div>
    <div class="section-sub">点击空位后添加；已有条目可拖拽排序。手机端点击条目，再点击目标位置即可移动或互换。</div>
    <div class="rec-slot-status" id="recSlotStatus" role="status" aria-live="polite"></div>
    <div class="rec-list" role="list" aria-label="十二个推荐榜位置">`;

  recSlots.forEach((rec, slot) => {
    if (rec) {
      html += `<div class="rec-card${recMovingSlot === slot ? ' rec-card-moving' : ''}" data-rec-slot="${slot}" draggable="true" role="button" tabindex="0" aria-pressed="${recMovingSlot === slot ? 'true' : 'false'}" aria-label="第 ${slot + 1} 位：${escapeHtml(rec.title)}">
        <span class="rec-slot-index">${slot + 1}</span>
        <div class="cover">
          ${rec.image_url ? `<img src="${escapeHtml(rec.image_url)}" alt="" onerror="this.style.display='none'">` : `<span>#${slot + 1}</span>`}
        </div>
        <div class="info">
          <div class="title">${escapeHtml(rec.title)}</div>
          ${rec.rating ? `<div class="rating">${icon('star')} ${rec.rating}</div>` : ''}
          <div class="rec-drag-hint">拖动或点击选择</div>
        </div>
        <button class="remove-btn" onclick="removeRecommendation(${rec.id})" title="移除第 ${slot + 1} 位" aria-label="移除第 ${slot + 1} 位">×</button>
      </div>`;
      return;
    }

    html += `<button type="button" class="rec-card rec-card-empty${recTargetSlot === slot ? ' rec-card-target' : ''}" data-rec-slot="${slot}" role="listitem" aria-pressed="${recTargetSlot === slot ? 'true' : 'false'}" aria-label="选择第 ${slot + 1} 位空槽">
      <span class="rec-slot-index">${slot + 1}</span>
      <div class="cover"><span>空缺</span></div>
      <div class="info">
        <div class="title">第 ${slot + 1} 位</div>
        <div class="rec-drag-hint">点击选择此位置</div>
      </nav>
    </button>`;
  });

  html += `</div></div></div>`; // close rec-list, card, rec-layout

  html += `<div class="section-card moe-king-admin">
    <div class="section-title">萌王 <span style="font-size:12px;color:var(--text-muted);font-weight:400;">每个同好会 1 位 Bangumi 角色</span></div>
    <div class="search-area">
      <div class="search-input-wrap">
        <input type="text" id="moeKingSearchInput" class="form-input" placeholder="搜索 Bangumi 角色" style="min-width:0;flex:1;max-width:260px;" onkeydown="if(event.key==='Enter') searchMoeKing()">
        <button class="btn btn-primary" onclick="searchMoeKing()">搜索角色</button>
      </div>
      <div class="current-moe-king">`;
  if (moeKingData) {
    const title = moeKingData.name_cn || moeKingData.name;
    html += `<div class="search-item">
      <div class="thumb">${moeKingData.image_url ? `<img src="${escapeHtml(moeKingData.image_url)}" alt="">` : '王'}</div>
      <div class="item-info">
        <div class="item-title">${escapeHtml(title)}</div>
        <div class="item-sub">当前萌王 · #${escapeHtml(String(moeKingData.character_id))}</div>
      </div>
      <button class="remove-btn" onclick="removeMoeKing()" title="移除">×</button>
    </div>`;
  } else {
    html += '<div style="color:var(--text-muted);font-size:13px;padding:10px 0;">暂未设置萌王</div>';
  }
  html += `</div><div class="search-results" id="moeKingSearchResults">`;
  if (!moeKingSearchResults.length) {
    html += '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">' +
      (moeKingHasSearched ? '未找到相关角色' : '输入角色名，从 Bangumi 角色库中选择一位萌王') +
      '</div>';
  } else {
    moeKingSearchResults.forEach(item => {
      const title = item.name_cn || item.name || ('角色 #' + item.character_id);
      html += `<div class="search-item">
        <div class="thumb">${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="">` : '王'}</div>
        <div class="item-info">
          <div class="item-title">${escapeHtml(title)}</div>
          <div class="item-sub">${escapeHtml((item.summary || '').slice(0, 60))}</div>
        </div>
        <button class="add-btn" onclick="setMoeKing(${item.character_id})">设为萌王</button>
      </div>`;
    });
  }
  html += `</div></div></div>`;

  container.innerHTML = html;
  bindRecommendationBoardInteractions();

  // Restore search input value after re-render
  const restoredInput = document.getElementById('recSearchInput');
  if (restoredInput) restoredInput.value = savedSearch;
}

async function searchMoeKing() {
  const input = document.getElementById('moeKingSearchInput');
  const keyword = input ? input.value.trim() : '';
  if (!keyword) return;
  moeKingHasSearched = true;
  const resultsDiv = document.getElementById('moeKingSearchResults');
  if (resultsDiv) resultsDiv.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">搜索中...</div>';
  try {
    const r = await fetch(`../api/bangumi_proxy.php?action=search_character&keyword=${encodeURIComponent(keyword)}`);
    const data = await r.json();
    moeKingSearchResults = data.success ? (data.data || []) : [];
  } catch { moeKingSearchResults = []; }
  await renderRecommendations();
  const restored = document.getElementById('moeKingSearchInput');
  if (restored) restored.value = keyword;
}

async function setMoeKing(characterId) {
  const item = moeKingSearchResults.find(r => Number(r.character_id) === Number(characterId));
  if (!item) return showToast('找不到该角色信息，请重新搜索', 'error');
  try {
    const r = await fetch('../api/club_moe_king.php?action=set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        club_id: selectedClubId,
        country: selectedCountry,
        character_id: item.character_id,
        name: item.name || '',
        name_cn: item.name_cn || '',
        image_url: item.image_url || '',
        summary: item.summary || ''
      })
    });
    const data = await r.json();
    if (data.success) {
      showToast('萌王已更新', 'success');
      await renderRecommendations();
    } else {
      showToast(data.message || '设置失败', 'error');
    }
  } catch { showToast('网络错误', 'error'); }
}

async function removeMoeKing() {
  if (!confirm('确定移除当前萌王？')) return;
  try {
    const r = await fetch('../api/club_moe_king.php?action=remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ club_id: selectedClubId, country: selectedCountry })
    });
    const data = await r.json();
    if (data.success) {
      showToast('萌王已移除', 'success');
      moeKingData = null;
      await renderRecommendations();
    } else {
      showToast(data.message || '移除失败', 'error');
    }
  } catch { showToast('网络错误', 'error'); }
}

async function searchBangumi() {
  const input = document.getElementById('recSearchInput');
  const keyword = input ? input.value.trim() : '';
  if (!keyword) return;

  recHasSearched = true;
  const resultsDiv = document.getElementById('recSearchResults');
  if (resultsDiv) {
    resultsDiv.innerHTML = '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px;">搜索中…</div>';
  }

  try {
    const r = await fetch(`../api/bangumi_proxy.php?action=search&keyword=${encodeURIComponent(keyword)}`);
    const data = await r.json();
    recSearchResults = data.success ? (data.data || []) : [];
  } catch { recSearchResults = []; }

  await renderRecommendations();
}

async function addRecommendation(bangumiId) {
  const item = recSearchResults.find(r => r.bangumi_id === bangumiId);
  if (!item) {
    showToast('找不到该条目信息，请重新搜索', 'error');
    return;
  }

  const targetSlot = recTargetSlot !== null && !recSlots[recTargetSlot]
    ? recTargetSlot
    : firstEmptyRecommendationSlot();
  if (targetSlot < 0) {
    showToast('推荐榜已填满，请先移除或调整已有条目', 'error');
    return;
  }

  // Bangumi 搜索 API 不再返回评分，从条目详情获取
  let rating = item.rating || 0;
  try {
    const detailResp = await fetch(`../api/bangumi_proxy.php?action=get&id=${bangumiId}`);
    const detailData = await detailResp.json();
    if (detailData.success && detailData.data) {
      const d = detailData.data;
      const s = d.rating?.score || d.score || 0;
      if (s > 0) rating = s;
    }
  } catch (e) { /* use search result rating */ }

  try {
    const r = await fetch('../api/club_recommendations.php?action=add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        club_id: selectedClubId,
        country: selectedCountry,
        bangumi_id: bangumiId,
        title: item.title_cn || item.title,
        image_url: item.image_url || '',
        rating: rating,
        summary: item.summary || '',
        position: targetSlot + 1
      })
    });
    const data = await r.json();
    if (data.success) {
      showToast('已添加到推荐榜', 'success', 'star');
      await renderRecommendations();
    } else {
      showToast(data.message || '添加失败', 'error');
    }
  } catch { showToast('网络错误', 'error'); }
}

async function removeRecommendation(id) {
  if (!confirm('确定从推荐榜移除？')) return;
  try {
    const r = await fetch('../api/club_recommendations.php?action=remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ id })
    });
    const data = await r.json();
    if (data.success) {
      showToast('已移除', 'success');
      await renderRecommendations();
    } else {
      showToast(data.message || '移除失败', 'error');
    }
  } catch { showToast('网络错误', 'error'); }
}

// ====== Tab ======
function switchTab(tab) {
  if (tab === 'users' || tab === 'jiangsu') {
    if (!isSuperAdminUser()) {
      showToast('仅超级管理员可用', 'error');
      return;
    }
  }
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderList(tab);
}

// ====== Utilities ======
function statusText(status) {
  return status === 'active' || status === 'approved'
    ? icon('check') + ' 已通过'
    : status === 'rejected'
      ? icon('xCircle') + ' 已拒绝'
      : icon('clock') + ' 待审核';
}

function applyRoleText(role) {
  return role === 'external' ? '外交成员（IEM）' : role === 'representative' ? '负责人' : role === 'manager' ? '管理员' : '成员';
}

function joinMethodText(method) {
  return method === 'external_exchange' ? '外校成员交流申请' : method === 'school_code' ? '本校成员申请（有绑定码）' : '本校成员申请加入（未有绑定码）';
}

// ====== Event Listeners ======
document.getElementById('userEditModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeUserEditModal();
});

document.getElementById('tabBar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

// ====== Start ======
init().then(() => {
  // ?tab= 深链（如 club_manager.html?tab=recognition 直达考核设置）
  const urlTab = new URLSearchParams(location.search).get('tab');
  if (urlTab && TAB_NAMES_MAP[urlTab] && urlTab !== 'pending' && currentUser) switchTab(urlTab);
});
