<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VNFest 使用文档管理</title>
  <link rel="stylesheet" href="../css/site-header.css?v=20260827-site-header" />
  <script defer src="../js/site-header.js?v=20260827-site-header"></script>
  <style>
    :root { --ink:#1f2933; --muted:#52606d; --line:#d9dee7; --paper:#fff; --page:#f4f6f8; --blue:#1a73e8; --teal:#0c6f78; }
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:var(--page);font:14px/1.6 "Noto Sans SC","Noto Sans JP","Segoe UI",sans-serif}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 24px;background:#172033;color:#fff}.topbar h1{margin:0;font-size:20px}.topbar nav{display:flex;gap:14px;flex-wrap:wrap}.topbar a{color:#dbeafe;text-decoration:none}.topbar a:hover{text-decoration:underline}.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 310px;gap:18px;max-width:1540px;margin:0 auto;padding:20px}.panel{min-width:0;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 1px 3px rgba(15,23,42,.06)}.panel h2{margin:0 0 12px;font-size:16px}.field{display:grid;gap:6px;margin:0 0 13px}.field label{color:var(--muted);font-size:12px;font-weight:700}input,textarea,select{width:100%;border:1px solid #cbd2d9;border-radius:7px;padding:9px 10px;color:var(--ink);background:#fff;font:inherit}textarea{min-height:100px;resize:vertical}textarea.code{min-height:420px;font:12px/1.6 Consolas,"SFMono-Regular",monospace;tab-size:2}input:focus,textarea:focus,select:focus{border-color:var(--blue);outline:3px solid rgba(26,115,232,.14)}button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:8px 11px;border:1px solid transparent;border-radius:7px;color:#174ea6;background:#e6eef8;font:700 13px inherit;cursor:pointer;text-decoration:none}button.primary{color:#fff;background:var(--blue)}button.danger{color:#b42318;background:#fee4e2}button.neutral{color:#334e68;background:#eef2f7}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.status{min-height:22px;margin-top:12px;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.active{color:#fff;background:var(--teal)}.article-list{display:grid;gap:3px;max-height:68vh;overflow:auto}.article-choice{display:grid;gap:2px;width:100%;padding:9px;border:0;border-radius:6px;color:var(--ink);background:transparent;text-align:left;cursor:pointer}.article-choice:hover,.article-choice.active{background:#e8f4f4}.article-choice strong{font-size:13px}.article-choice span{color:var(--muted);font-size:11px}.meta{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:var(--muted);font-size:12px}.meta strong{color:var(--ink)}.notice{margin:0 0 14px;padding:11px 12px;border:1px solid #b7d9dd;border-radius:7px;background:#effafb;color:#245257;font-size:13px}.notice.warn{border-color:#f6d28b;background:#fff8e8;color:#7a4d00}.preview{max-height:62vh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.preview h1{margin:0 0 10px;font:400 25px/1.3 Georgia,"Noto Serif SC",serif}.preview h2{margin:25px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line);font-size:18px}.preview p{margin:7px 0;color:#384957}.preview pre{padding:10px;overflow:auto;background:#edf1f4;font-size:12px}.preview img{max-width:100%;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:1120px){.layout{grid-template-columns:250px minmax(0,1fr)}.right-panel{grid-column:1/-1}.preview{max-height:420px}}@media(max-width:720px){.topbar{align-items:flex-start;flex-direction:column;padding:14px}.layout{grid-template-columns:1fr;padding:12px}.article-list{max-height:260px}}
  </style>
</head>
<body>
  <header class="topbar"><h1>VNFest 使用文档管理</h1><nav><a href="../wiki/guide/" target="_blank" rel="noopener">查看公开文档</a><a href="../wiki/index.html">返回 Wiki</a><a href="./wiki_editor.html">同好会 Wiki 编辑</a><a href="../index.html">返回地图</a></nav></header>
  <main class="layout">
    <aside class="panel"><h2>文档与语言</h2><div class="tabs"><button type="button" data-lang="zh-CN" class="active">中文</button><button type="button" data-lang="ja-JP">日本語</button></div><div id="diffNotice" class="notice hidden"></div><div class="field"><label for="articleFilter">筛选文章</label><input id="articleFilter" type="search" placeholder="搜索标题、产品或角色"></div><div id="articleList" class="article-list" aria-label="文档文章"></div></aside>
    <section class="panel"><h2>文章编辑</h2><p class="notice">常用字段可直接编辑；高级内容使用文章 JSON。保存草稿不会影响公开页面，发布后才对读者可见。</p><div class="field"><label for="title">标题</label><input id="title" maxlength="160"></div><div class="field"><label for="product">所属产品</label><input id="product" maxlength="80"></div><div class="field"><label for="audience">面向角色</label><input id="audience" maxlength="80"></div><div class="field"><label for="summary">摘要</label><textarea id="summary" maxlength="1500"></textarea></div><div class="field"><label for="articleJson">文章 JSON（章节、步骤、提示、表格与图片）</label><textarea id="articleJson" class="code" spellcheck="false"></textarea></div><div class="actions"><button id="saveDraft" type="button" class="neutral">保存草稿</button><button id="previewButton" type="button" class="neutral">预览</button><button id="publish" type="button" class="primary">发布</button><button id="unpublish" type="button" class="danger">撤回发布</button><button id="resetSeed" type="button" class="neutral">恢复代码基线</button></div><div id="status" class="status" aria-live="polite"></div></section>
    <aside class="panel right-panel"><h2>状态与资源</h2><div id="articleMeta" class="meta">正在读取文档状态…</div><h2 style="margin-top:22px">上传截图</h2><p class="notice">仅可上传 JPEG、PNG、GIF、WebP，单张最多 10MB。上传后会生成可粘贴到文章 JSON 的图片块。</p><div class="field"><label for="guideImage">选择已脱敏的截图</label><input id="guideImage" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></div><div class="actions"><button id="uploadImage" type="button">上传截图</button></div><div id="uploadResult" class="status"></div><h2 style="margin-top:22px">实时预览</h2><div id="preview" class="preview">选择一篇文章后显示预览。</div></aside>
  </main>
  <script>
  (function () {
    'use strict';
    var API = '../api/wiki.php';
    var state = { lang: 'zh-CN', runtime: null, id: '', record: null, seedRevision: '' };
    var $ = function (id) { return document.getElementById(id); };
    function escapeHtml(value) { var e = document.createElement('div'); e.textContent = value == null ? '' : String(value); return e.innerHTML; }
    function setStatus(message, ok) { $('status').textContent = message || ''; $('status').style.color = ok ? '#188038' : '#b42318'; }
    async function api(action, options) { options = options || {}; var response = await fetch(API + '?action=' + encodeURIComponent(action) + (options.query || ''), { method: options.method || 'GET', headers: options.body instanceof FormData ? {} : { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: options.body instanceof FormData ? options.body : (options.body ? JSON.stringify(options.body) : undefined) }); var text = await response.text(); var data; try { data = text ? JSON.parse(text) : {}; } catch (error) { throw new Error('接口返回异常（HTTP ' + response.status + '）：' + text.replace(/\s+/g, ' ').slice(0, 140)); } if (!response.ok || !data.success) throw new Error(data.message || ('HTTP ' + response.status)); return data; }
    function publicArticle() { if (!state.record) return null; return state.record.draft || state.record.published || null; }
    function syncFields(article) { $('title').value = article.title || ''; $('product').value = article.product || ''; $('audience').value = article.audience || ''; $('summary').value = article.summary || ''; $('articleJson').value = JSON.stringify(article, null, 2); }
    function parseEditor() { var article; try { article = JSON.parse($('articleJson').value); } catch (error) { throw new Error('文章 JSON 格式不正确：' + error.message); } article.id = state.id; article.title = $('title').value.trim(); article.product = $('product').value.trim(); article.audience = $('audience').value.trim(); article.summary = $('summary').value.trim(); return article; }
    function renderList() { var runtime = state.runtime || {}; var q = $('articleFilter').value.trim().toLowerCase(); var records = Object.keys(runtime.articles || {}).map(function (id) { return runtime.articles[id]; }).filter(function (record) { var article = record.draft || record.published || {}; return !q || [article.title, article.product, article.audience, record.id].join(' ').toLowerCase().indexOf(q) !== -1; }); $('articleList').innerHTML = records.map(function (record) { var article = record.draft || record.published || {}; return '<button type="button" class="article-choice ' + (record.id === state.id ? 'active' : '') + '" data-id="' + escapeHtml(record.id) + '"><strong>' + escapeHtml(article.title || record.id) + '</strong><span>' + escapeHtml(article.product || '') + ' · ' + escapeHtml(record.status || 'draft') + '</span></button>'; }).join('') || '<p class="notice">没有匹配文章。</p>'; $('articleList').querySelectorAll('[data-id]').forEach(function (button) { button.addEventListener('click', function () { selectArticle(button.dataset.id); }); }); }
    function renderMeta() { var r = state.record || {}; var draft = r.draft ? '有未发布草稿' : '无草稿'; $('articleMeta').innerHTML = '<div><strong>文章 ID</strong><br>' + escapeHtml(r.id || '-') + '</div><div><strong>公开状态</strong><br>' + escapeHtml(r.status || '-') + '</div><div><strong>草稿</strong><br>' + draft + '</div><div><strong>最后修改</strong><br>' + escapeHtml(r.updatedAt || '-') + '</div><div><strong>基线版本</strong><br>' + escapeHtml(r.seedRevision || '-') + '</div>'; }
    function renderPreview(article) { if (!article) { $('preview').textContent = '选择一篇文章后显示预览。'; return; } var sections = (article.sections || []).map(function (section) { return '<section><h2>' + escapeHtml(section.title) + '</h2>' + (section.blocks || []).map(function (block) { if (block.type === 'paragraph') return '<p>' + escapeHtml(block.text) + '</p>'; if (block.type === 'heading') return '<h3>' + escapeHtml(block.text) + '</h3>'; if (block.type === 'steps' || block.type === 'list') return '<ul>' + (block.items || []).map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul>'; if (block.type === 'code') return '<pre>' + escapeHtml(block.text) + '</pre>'; if (block.type === 'image') return '<figure><img src="' + escapeHtml(block.src || '') + '" alt="' + escapeHtml(block.alt || '') + '"><figcaption>' + escapeHtml(block.caption || '') + '</figcaption></figure>'; if (block.type === 'tip' || block.type === 'warning') return '<p><strong>' + escapeHtml(block.label || '提示') + '：</strong>' + escapeHtml(block.text || '') + '</p>'; if (block.type === 'table') return '<p><strong>表格：</strong>' + escapeHtml((block.headers || []).join(' / ')) + '</p>'; return ''; }).join('') + '</section>'; }).join(''); $('preview').innerHTML = '<h1>' + escapeHtml(article.title || '') + '</h1><p>' + escapeHtml(article.summary || '') + '</p>' + sections; }
    function selectArticle(id) { state.id = id; state.record = state.runtime.articles[id]; syncFields(publicArticle()); renderList(); renderMeta(); renderPreview(publicArticle()); }
    async function load() { try { var data = await api('guide_admin_catalog', { query: '&lang=' + encodeURIComponent(state.lang) }); state.runtime = data.runtime; state.seedRevision = data.seedRevision; renderList(); var first = state.id && state.runtime.articles[state.id] ? state.id : Object.keys(state.runtime.articles || {})[0]; if (first) selectArticle(first); var diff = await api('guide_diff', { query: '&lang=' + encodeURIComponent(state.lang) }); if (diff.changed) { $('diffNotice').className = 'notice warn'; $('diffNotice').textContent = '代码种子已更新：可保留当前发布内容，或选中文章后使用“恢复代码基线”生成可编辑草稿。'; } else { $('diffNotice').className = 'notice hidden'; } setStatus('已加载 ' + state.lang + ' 文档。', true); } catch (error) { setStatus(error.message, false); } }
    async function persist(action) { try { var data = await api(action, { method: 'POST', body: { lang: state.lang, id: state.id, article: action === 'guide_save_draft' ? parseEditor() : undefined } }); state.runtime.articles[state.id] = data.record; state.record = data.record; syncFields(publicArticle()); renderList(); renderMeta(); renderPreview(publicArticle()); setStatus(action === 'guide_publish' ? '已发布到公开文档站。' : action === 'guide_unpublish' ? '已撤回公开版本。' : action === 'guide_reset_seed' ? '已从代码基线创建草稿。' : '草稿已保存。', true); } catch (error) { setStatus(error.message, false); } }
    document.querySelectorAll('[data-lang]').forEach(function (button) { button.addEventListener('click', function () { state.lang = button.dataset.lang; state.id = ''; document.querySelectorAll('[data-lang]').forEach(function (x) { x.classList.toggle('active', x === button); }); load(); }); });
    $('articleFilter').addEventListener('input', renderList); $('previewButton').addEventListener('click', function () { try { renderPreview(parseEditor()); setStatus('已使用当前编辑内容预览。', true); } catch (error) { setStatus(error.message, false); } }); $('saveDraft').addEventListener('click', function () { persist('guide_save_draft'); }); $('publish').addEventListener('click', function () { persist('guide_publish'); }); $('unpublish').addEventListener('click', function () { if (confirm('确认撤回这篇公开文档？')) persist('guide_unpublish'); }); $('resetSeed').addEventListener('click', function () { if (confirm('这会用代码基线创建新草稿，不会自动发布。继续吗？')) persist('guide_reset_seed'); });
    $('uploadImage').addEventListener('click', async function () { var file = $('guideImage').files[0]; if (!file) { $('uploadResult').textContent = '请先选择截图。'; return; } if (file.size > 10 * 1024 * 1024) { $('uploadResult').textContent = '截图不能超过 10MB。'; return; } var form = new FormData(); form.append('image', file); try { var data = await api('guide_upload', { method: 'POST', body: form }); var block = { type: 'image', src: data.image_url, alt: '请填写图片替代文本', caption: '请填写中日对应图注' }; $('uploadResult').textContent = '上传成功。可将以下图片块粘贴到对应章节的 blocks 中：\n' + JSON.stringify(block, null, 2); } catch (error) { $('uploadResult').textContent = error.message; } });
    load();
  }());
  </script>
</body>
</html>
