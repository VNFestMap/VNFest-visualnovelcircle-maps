<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同好会企划管理 - VNFest</title>
  <link rel="stylesheet" href="../css/site-header.css?v=20260827-site-header" />
  <script defer src="../js/site-header.js?v=20260827-site-header"></script>
  <link rel="stylesheet" href="../css/vote-common.css">
  <link rel="stylesheet" href="../css/admin-manager.css">
</head>
<body>
  <a class="skip-link" href="#projectManagerMain">跳到企划管理内容</a>
  <main class="shell" id="projectManagerMain" tabindex="-1">
    <header class="topbar" role="banner">
      <div class="brand">
        <strong>同好会企划管理</strong>
        <span>创建十二器/萌战企划，配置阶段，管理赛程</span>
      </div>
      <nav class="actions" aria-label="企划管理快捷入口">
        <a class="btn" href="../club_square.html">同好会广场</a>
        <a class="btn" href="../user.html">用户中心</a>
        <button class="btn theme-toggle" id="themeToggle" type="button" title="切换明亮/暗色模式" aria-label="切换明亮/暗色模式">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </nav>
    </header>

    <div class="admin-layout">
      <aside class="sidebar" aria-label="企划创建与列表">
        <div class="card create-card" id="createCard">
          <button class="create-header" id="createToggle" type="button" aria-expanded="false" aria-controls="createBody">
            <span class="create-title">创建新企划</span>
            <span class="create-subtitle">十二器 / 萌战</span>
            <span class="arrow">&#9660;</span>
          </button>
          <div class="create-body" id="createBody">
            <div class="form-field">
              <label class="field-label" id="createTypeLabel">类型</label>
              <div class="segmented" id="createType">
                <button class="segmented-btn twelve active" type="button" data-type="twelve" aria-pressed="true">十二器</button>
                <button class="segmented-btn moe" type="button" data-type="moe" aria-pressed="false">萌战</button>
              </div>
            </div>

            <div class="suffix-field" id="suffixField">
              <label class="field-label" for="suffixInput">活动名称后缀</label>
              <div class="suffix-row">
                <span>十二</span>
                <input class="suffix-input" id="suffixInput" maxlength="1" placeholder="器" aria-describedby="suffixHint">
                <span>器</span>
                <span class="suffix-preview">→ 十二<span id="suffixPreview">器</span></span>
              </div>
              <div class="suffix-hint" id="suffixHint">输入一个汉字，留空默认「十二器」。</div>
            </div>

            <div class="form-field">
              <label class="field-label" id="clubSearchLabel">所属同好会</label>
              <div class="search-wrap" id="clubSearchWrap">
                <div class="search-input" id="clubSearchInput" tabindex="0" role="combobox" aria-labelledby="clubSearchLabel" aria-haspopup="listbox" aria-expanded="false" aria-controls="clubSearchResults">
                  <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                  <input id="clubSearchReal" class="club-search-real" type="search" autocomplete="off" aria-label="搜索同好会" aria-controls="clubSearchResults" placeholder="输入学校、同好会或地区搜索">
                  <span id="clubSearchPlaceholder" class="search-placeholder" aria-hidden="true">输入同好会名称搜索...</span>
                  <span id="clubSearchChip" class="chip" style="display:none;"><span id="clubSearchChipName"></span><button class="chip-remove" id="clubSearchClear" type="button" aria-label="清除已选同好会">&times;</button></span>
                </div>
                <div class="search-results" id="clubSearchResults" role="listbox" aria-label="同好会搜索结果"></div>
              </div>
            </div>

            <div class="form-field">
              <label class="field-label" for="createTitle">标题</label>
              <input class="form-input" id="createTitle" placeholder="例如 2026 年度 Galgame 十二器评选">
            </div>

            <div class="form-row">
              <div class="form-field">
                <label class="field-label" for="createYear">年份</label>
                <input class="form-input" id="createYear" value="2026" inputmode="numeric" autocomplete="off">
              </div>
              <div class="form-field">
                <label class="field-label" for="createCountry">地区</label>
                <select class="form-select" id="createCountry">
                  <option value="china">中国</option>
                  <option value="japan">日本</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label class="field-label" for="createVisibility">可见性</label>
                <select class="form-select" id="createVisibility">
                  <option value="public">公开浏览</option>
                  <option value="club_only">成员可见</option>
                  <option value="unlisted">不列入广场</option>
                </select>
              </div>
              <div class="form-field">
                <label class="field-label" for="createEligibility">参与资格</label>
                <select class="form-select" id="createEligibility">
                  <option value="club_member">同好会成员</option>
                  <option value="public">登录用户</option>
                </select>
              </div>
            </div>

            <div class="form-field">
              <label class="field-label" for="createResultVisibility">结果公开</label>
              <select class="form-select" id="createResultVisibility">
                <option value="live_rank_only">实时排名</option>
                <option value="live_votes">实时票数</option>
                <option value="after_stage">阶段后公开</option>
                <option value="after_event">活动结束后公开</option>
                <option value="hidden">隐藏</option>
              </select>
            </div>

            <div class="form-field">
              <label class="field-label" for="createDescription">说明</label>
              <textarea class="form-textarea" id="createDescription" placeholder="选填，简要介绍企划规则..."></textarea>
            </div>

            <button class="btn-submit twelve" id="createBtn" type="button">创建草稿</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span>我的企划 <span style="font-size:11px;color:var(--am-text-secondary);font-weight:400;" id="projectCount"></span></span>
          </div>
          <div class="project-list" id="manageList">
            <div class="empty-state"><div class="empty-state-inner"><p>暂无可管理企划</p></div></div>
          </div>
        </div>
      </aside>

      <section class="detail-area" id="detailArea" aria-live="polite" aria-label="企划详情">
        <div class="empty-state">
          <div class="empty-state-inner">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" style="margin:0 auto 12px;opacity:0.3;">
              <rect x="8" y="8" width="32" height="32" rx="4" stroke="var(--am-text-secondary)" stroke-width="1.5" fill="none"/>
              <line x1="24" y1="16" x2="24" y2="32" stroke="var(--am-text-secondary)" stroke-width="1.5"/>
              <line x1="16" y1="24" x2="32" y2="24" stroke="var(--am-text-secondary)" stroke-width="1.5"/>
            </svg>
            <p>选择一个企划开始管理</p>
            <p class="hint">或在左侧创建新企划</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="stageModal" style="display:none;" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalStageTitle" aria-describedby="modalBody">
      <div class="modal-header">
        <div>
          <span class="stage-tag nomination" id="modalStageTag">提名期</span>
          <strong style="font-size:16px;margin-left:8px;" id="modalStageTitle">编辑阶段</strong>
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭阶段编辑弹窗">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="stage-btn" id="modalCancel" type="button">取消</button>
        <button class="stage-btn primary" id="modalSave" type="button">保存配置</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="tieModal" style="display:none;" role="presentation">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tieModalTitle" aria-describedby="tieModalBody">
      <div class="modal-header">
        <div>
          <span class="stage-tag reviewing">裁定</span>
          <strong style="font-size:16px;margin-left:8px;" id="tieModalTitle">晋级线同分裁定</strong>
        </div>
        <button class="modal-close" id="tieModalClose" type="button" aria-label="关闭同分裁定弹窗">&times;</button>
      </div>
      <div class="modal-body" id="tieModalBody"></div>
      <div class="modal-footer">
        <button class="stage-btn" id="tieModalCancel" type="button">取消</button>
        <button class="stage-btn primary" id="tieModalSubmit" type="button">提交裁定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="../js/vote-common.js?v=20260601-flow9"></script>
  <script src="../js/club-project-manager.js?v=20260601-flow9"></script>
  <script>initVoteThemeToggle('themeToggle');</script>
</body>
</html>
