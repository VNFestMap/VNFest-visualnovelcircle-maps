<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../js/language-runtime.js?v=20260813-language"></script>
  <script src="../js/language-catalog.js?v=20260813-language"></script>
  <script src="../js/language-static-ja.js?v=20260813-account-language"></script>
  <script defer src="../js/page-i18n.js?v=20260813-language"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>萌战实时对阵表 - VNFest</title>
  <link rel="stylesheet" href="../css/site-header.css?v=20260827-site-header" />
  <script defer src="../js/site-header.js?v=20260827-site-header"></script>
  <script src="../js/theme-runtime.js?v=20260702-theme"></script>
  <link rel="stylesheet" href="../css/vote-common.css">
  <link rel="stylesheet" href="../css/vote-activity.css">
  <link rel="stylesheet" href="moe-bracket.css?v=20260626">
</head>
<body>
  <div class="mb-page">
    <header class="mb-topbar">
      <nav class="mb-breadcrumbs" aria-label="当前位置">
        <a href="../index.html">VNFEST</a>
        <span>/</span>
        <a href="index.html">萌战活动</a>
        <span>/</span>
        <span>对阵表</span>
      </nav>
      <div class="mb-topbar-actions">
        <a id="mbContestLink" class="mb-link" href="contest.html">活动详情</a>
        <a id="mbBackLink" class="mb-link" href="index.html">返回活动</a>
        <button id="themeToggle" class="mb-theme-toggle" title="切换明亮/暗色模式" aria-label="切换明亮/暗色模式">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <main class="mb-main">
      <section class="mb-page-head">
        <div>
          <h1 id="mbPageTitle">加载中...</h1>
          <p id="mbPageSub">读取活动与对阵数据</p>
        </div>
        <div class="mb-board-tools" aria-label="对阵图控制">
          <button class="mb-icon-btn" type="button" id="mbZoomOut" title="缩小" aria-label="缩小对阵图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg>
          </button>
          <button class="mb-zoom-readout" type="button" id="mbZoomReset" aria-label="重置画布视图"><span id="mbZoomValue">100%</span></button>
          <button class="mb-icon-btn" type="button" id="mbZoomIn" title="放大" aria-label="放大对阵图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
          <button class="mb-icon-btn" type="button" id="mbFullscreen" title="全屏" aria-label="全屏展开对阵图">
            <svg id="mbFullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </section>

      <nav class="mb-stage-tabs" id="mbStageTabs" aria-label="对阵阶段"></nav>

      <section class="mb-status-strip" id="mbStatusStrip">
        <span class="mb-pill">加载中</span>
      </section>

      <section class="mb-board-shell" aria-label="萌战实时对阵表">
        <div class="mb-board-viewport" id="mbBoardViewport" role="region" aria-label="萌战对阵图画布，可拖动与缩放">
          <div class="mb-board-canvas" id="mbBoardCanvas">
            <div class="mb-bracket-board" id="mbBracketBoard">
              <div class="mb-loading">加载对阵中...</div>
            </div>
          </div>
          <button class="mb-icon-btn mb-fs-floating" type="button" id="mbExitFullscreen" aria-label="退出全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M8 3v3H5m14 0h-3V3M3 16h3v3m12-3h3v3"/></svg>
          </button>
          <div class="mb-board-hint">拖动移动 · 滚轮缩放</div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/vote-common.js"></script>
  <script src="../js/vote-activity.js"></script>
  <script src="moe-bracket.js?v=20260626"></script>
  <script>initVoteThemeToggle('themeToggle');</script>
</body>
</html>
