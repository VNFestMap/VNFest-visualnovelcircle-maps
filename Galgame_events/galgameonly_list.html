<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="../js/language-runtime.js?v=20260813-language"></script>
  <script src="../js/language-catalog.js?v=20260813-language"></script>
  <script src="../js/language-static-ja.js?v=20260813-account-language"></script>
  <script defer src="../js/page-i18n.js?v=20260813-language"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../js/theme-runtime.js?v=20260702-theme"></script>
<title>高校专属通道</title>
<link rel="stylesheet" href="../css/site-header.css?v=20260827-site-header" />
<script defer src="../js/site-header.js?v=20260827-site-header"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Design tokens — shared (theme-independent)
   ============================================================ */
:root {
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 100px;
  --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Jost', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --transition-theme: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

/* ============================================================
   Design tokens — dark theme
   ============================================================ */
[data-theme="dark"] {
  --bg: oklch(18% 0.035 275);
  --surface: oklch(24% 0.04 272);
  --surface-raised: oklch(30% 0.045 270);
  --fg: oklch(93% 0.003 80);
  --fg-soft: oklch(84% 0.015 275);
  --fg-muted: oklch(75% 0.03 270);
  --fg-dim: oklch(65% 0.04 268);
  --border: oklch(30% 0.045 270 / 0.35);
  --border-light: oklch(38% 0.05 268 / 0.35);
  --accent: oklch(72% 0.07 290);
  --accent-fill: oklch(58% 0.08 290);
  --accent-muted: oklch(72% 0.05 290 / 0.15);
  --accent-ghost: oklch(72% 0.04 290 / 0.08);
  --shell: oklch(18% 0.035 275 / 0.85);
  --nav-hover-bg: rgba(236,234,233,0.06);
  --success: oklch(72% 0.12 155);
  --success-bg: oklch(72% 0.08 155 / 0.12);
  --success-border: oklch(72% 0.08 155 / 0.2);
  --warning: oklch(80% 0.12 85);
  --warning-bg: oklch(80% 0.08 85 / 0.12);
  --warning-border: oklch(80% 0.08 85 / 0.2);
  --danger: oklch(70% 0.14 25);
  --danger-bg: oklch(70% 0.10 25 / 0.12);
  --danger-border: oklch(70% 0.10 25 / 0.2);
  --pooled: oklch(72% 0.07 290);
  --pooled-bg: oklch(72% 0.05 290 / 0.12);
  --pooled-border: oklch(72% 0.05 290 / 0.2);
}

/* ============================================================
   Design tokens — light theme
   ============================================================ */
[data-theme="light"] {
  --bg: oklch(98% 0.005 270);
  --surface: oklch(100% 0 0);
  --surface-raised: oklch(97% 0.008 270);
  --fg: oklch(18% 0.01 270);
  --fg-soft: oklch(28% 0.015 270);
  --fg-muted: oklch(43% 0.03 270);
  --fg-dim: oklch(55% 0.03 270);
  --border: oklch(88% 0.01 260);
  --border-light: oklch(92% 0.01 260);
  --accent: oklch(44% 0.14 42);
  --accent-fill: oklch(78% 0.1 65);
  --accent-muted: oklch(44% 0.10 42 / 0.12);
  --accent-ghost: oklch(44% 0.08 42 / 0.06);
  --shell: oklch(100% 0 0 / 0.88);
  --nav-hover-bg: rgba(0,0,0,0.04);
  --success: oklch(45% 0.12 155);
  --success-bg: oklch(92% 0.06 155);
  --success-border: oklch(82% 0.08 155);
  --warning: oklch(55% 0.12 85);
  --warning-bg: oklch(95% 0.06 85);
  --warning-border: oklch(88% 0.08 85);
  --danger: oklch(45% 0.14 25);
  --danger-bg: oklch(95% 0.04 25);
  --danger-border: oklch(85% 0.06 25);
  --pooled: oklch(44% 0.12 290);
  --pooled-bg: oklch(95% 0.04 290);
  --pooled-border: oklch(85% 0.06 290);
}

/* ============================================================
   Reset & Base
   ============================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);transition:var(--transition-theme)}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--fg);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:var(--transition-theme);
}
a{color:var(--accent);text-decoration:none}

/* ============================================================
   Header — fixed, glass-morphism (matching poster)
   ============================================================ */
.poster-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--shell);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 36px;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  transition:var(--transition-theme);
}
.poster-header .header-left{display:flex;align-items:center;gap:16px}
.poster-header .site-title{
  font-family:var(--font-display);
  font-weight:700;font-size:18px;
  color:var(--fg);letter-spacing:0.5px;
  transition:var(--transition-theme);
}
.poster-header .header-nav{display:flex;align-items:center;gap:4px}
.poster-header .header-nav a{
  font-size:12px;font-weight:500;letter-spacing:0.02em;
  color:var(--fg-dim);
  padding:7px 18px;border-radius:var(--radius-full);
  transition:all 0.2s;
}
.poster-header .header-nav a:hover{color:var(--fg);background:var(--nav-hover-bg)}
.poster-header .header-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.poster-header .header-nav a.active{
  color:var(--fg-soft);
  background:var(--nav-hover-bg);
}

/* ============================================================
   Main container & page header
   ============================================================ */
.main-container{
  max-width:900px;margin:0 auto;
  padding:80px 24px 48px;
}
.page-header{margin-bottom:40px}
.page-title{
  font-family:var(--font-display);
  font-size:clamp(28px, 4vw, 40px);font-weight:700;
  color:var(--fg);
  margin-bottom:8px;letter-spacing:-0.02em;
  transition:var(--transition-theme);
}
.page-subtitle{
  font-size:14px;font-weight:400;
  color:var(--fg-muted);
  line-height:1.5;
  transition:var(--transition-theme);
}

/* ============================================================
   Loading / Empty states
   ============================================================ */
.loading-state,.empty-state{
  text-align:center;padding:80px 24px;
  color:var(--fg-dim);font-size:14px;letter-spacing:0.02em;
}
.loading-state .spinner{
  width:32px;height:32px;margin:0 auto 16px;
  border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   Event card — surface + border + top accent line on hover
   ============================================================ */
.event-card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:28px;
  margin-bottom:16px;
  opacity:0;
  transform:translateY(12px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              background 0.3s ease,
              box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  overflow:hidden;
}
/* directional top accent line (from poster .booth-card::before) */
.event-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;z-index:1;
  height:2px;
  background:var(--accent);
  opacity:0;
  transform:scaleX(0.6);
  transition:opacity 0.25s ease,transform 0.25s ease;
}
.event-card.visible{}
.event-card:hover{
  border-color:var(--border-light);
  background:var(--surface-raised);
  transform:translateY(-4px);
  box-shadow:0 10px 36px rgba(0,0,0,0.18),0 2px 4px var(--accent-ghost);
}
.event-card:hover::before{
  opacity:1;
  transform:scaleX(1);
}

.event-name{
  font-size:18px;font-weight:600;
  color:var(--fg);
  margin-bottom:8px;line-height:1.4;
  transition:var(--transition-theme);
}
.event-meta{
  display:flex;flex-wrap:wrap;gap:16px;
  font-size:12px;color:var(--fg-dim);
  margin-bottom:12px;
  transition:var(--transition-theme);
}
.event-meta span{display:inline-flex;align-items:center;gap:4px}
.event-desc{
  font-size:13px;color:var(--fg-muted);
  line-height:1.6;margin-bottom:20px;
  display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;
  transition:var(--transition-theme);
}
.event-footer{
  display:flex;flex-direction:column;gap:0;
}

/* ============================================================
   Apply section (booth + staff)
   ============================================================ */
.apply-section{width:100%}
.apply-row{
  display:flex;align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.apply-divider{
  height:1px;
  background:var(--border);
  margin:12px 0;
  transition:var(--transition-theme);
}
.apply-type-label{
  font-size:11px;
  color:var(--fg-dim);
  text-transform:uppercase;
  letter-spacing:0.08em;
  font-weight:600;
  min-width:40px;
  transition:var(--transition-theme);
}
.apply-row-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apply-row-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============================================================
   Status badges — pill-shaped with semantic oklch colors
   ============================================================ */
.status-badge{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:500;
  padding:3px 10px;border-radius:var(--radius-full);
  white-space:nowrap;
}
.status-pending{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-border)}
.status-approved{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
.status-rejected{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.status-none{background:var(--accent-ghost);color:var(--fg-dim)}

/* Staff-specific badges */
.staff-pooled{background:var(--pooled-bg);color:var(--pooled);border:1px solid var(--pooled-border)}
.staff-confirmed{background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)}
/* Booth phase-2 revision badge */
.status-revision{background:var(--warning-bg);color:var(--warning);border:1px solid var(--warning-border)}

/* Full / disabled badges */
.badge-full{
  display:inline-flex;align-items:center;
  background:var(--danger-bg);color:var(--danger);
  border:1px solid var(--danger-border);
  font-size:11px;padding:3px 10px;border-radius:var(--radius-full);
  white-space:nowrap;
}
.staff-full{
  background:var(--danger-bg);color:var(--danger);
  border:1px solid var(--danger-border);
  font-size:11px;padding:3px 10px;border-radius:var(--radius-full);
}

/* ============================================================
   Buttons — pill-shaped
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:inherit;font-size:12px;font-weight:500;
  padding:6px 16px;border-radius:var(--radius-full);
  border:none;cursor:pointer;
  transition:background 0.2s,opacity 0.2s,transform 0.1s,border-color 0.2s,color 0.2s;
  white-space:nowrap;
}
.btn:active{transform:scale(0.95);transition:transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1)}
.btn-apply:active,
.btn-delete:active{transform:scale(0.95);transition:transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-apply{background:var(--accent-fill);color:#0C0C0E}
.btn-delete{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}
.btn-edit{background:var(--nav-hover-bg);color:var(--fg-muted)}
.btn-disabled{
  background:transparent;
  color:var(--fg-dim);
  border:1px solid var(--border);
  cursor:not-allowed;
}
.btn-login{
  background:transparent;
  color:var(--fg-muted);
  border:1px solid var(--border);
  cursor:default;
}

@media(hover:hover)and(pointer:fine){
  .btn-apply:hover{background:var(--accent)}
  .btn-delete:hover{background:var(--danger-bg);border-color:var(--danger)}
  .btn-edit:hover{background:var(--accent-ghost);color:var(--fg-soft)}
  .btn-disabled:hover{background:transparent}
}

/* ============================================================
   Footer nav
   ============================================================ */
.page-footer{
  max-width:900px;margin:0 auto;
  padding:24px 24px 64px;
  display:flex;flex-wrap:wrap;gap:16px;
}
.page-footer a{
  font-size:13px;font-weight:500;
  color:var(--fg-muted);
  padding:8px 16px;border-radius:var(--radius-full);
  border:1px solid var(--border);
  transition:color 0.2s,border-color 0.2s;
}
.page-footer a:hover{color:var(--accent);border-color:var(--accent-muted)}

/* ============================================================
   Theme toggle button
   ============================================================ */
.theme-toggle {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 1px solid var(--border-light);
  border-radius: 50%;
  background: transparent;
  color: var(--fg-dim);
  font-size: 14px; line-height: 1;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin-left: 4px;
  font-family: inherit;
}
.theme-toggle:active {
  transform: rotate(180deg) scale(0.85);
}
.theme-toggle:hover {
  color: var(--fg);
  border-color: var(--fg-dim);
  background: var(--nav-hover-bg);
}

/* ============================================================
   Theme transition for key elements
   ============================================================ */
html,
.badge-full,
.staff-full,
.staff-pooled,
.staff-confirmed,
.page-footer a,
.apply-divider,
.apply-row,
.apply-type-label,
.event-footer {
  transition: var(--transition-theme);
}

/* ============================================================
   Animations — bezier-curve entrances & micro-interactions
   ============================================================ */
@keyframes fadeSlideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes badgePopIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.event-card {
  animation: fadeSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.status-badge {
  animation: badgePopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.poster-header {
  animation: slideDown 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.page-header {
  animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
}

.page-footer {
  animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
}

.apply-divider {
  animation: fadeIn 0.4s ease 0.3s both;
}

/* ============================================================
   Responsive
   ============================================================ */

/* --- Tablet / narrow desktop (<=1024px) --- */
@media(max-width:1024px){
  .main-container{padding:72px 20px 40px}
  .page-header{margin-bottom:32px}
  .event-card{padding:24px}
}

/* --- Mobile landscape & small tablets (<=768px) --- */
@media(max-width:768px){
  /* Header */
  .poster-header{
    padding:0 16px;
    height:52px;
  }
  .poster-header .site-title{
    font-size:16px;
    letter-spacing:0.3px;
  }
  .poster-header .header-nav{
    gap:2px;
  }
  .poster-header .header-nav a{
    font-size:12px;
    padding:8px 14px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  /* Theme toggle */
  .theme-toggle{
    width:40px;
    height:40px;
    font-size:16px;
    margin-left:2px;
    flex-shrink:0;
  }

  /* Main container */
  .main-container{
    padding:68px 16px 32px;
    max-width:100%;
  }

  /* Page header */
  .page-header{
    margin-bottom:28px;
  }
  .page-title{
    font-size:clamp(22px,5vw,32px);
    margin-bottom:6px;
  }
  .page-subtitle{
    font-size:13px;
    line-height:1.5;
  }

  /* Event cards */
  .event-card{
    padding:20px;
    border-radius:var(--radius-sm);
    margin-bottom:12px;
  }
  .event-name{
    font-size:clamp(16px,4vw,20px);
    margin-bottom:6px;
  }
  .event-meta{
    gap:12px;
    font-size:12px;
    margin-bottom:10px;
  }
  .event-desc{
    font-size:13px;
    line-height:1.55;
    margin-bottom:16px;
  }

  /* Apply section */
  .apply-row{
    gap:10px;
  }
  .apply-row-left{
    gap:8px;
  }
  .apply-row-right{
    gap:8px;
  }
  .apply-type-label{
    font-size:11px;
    min-width:36px;
  }
  .apply-divider{
    margin:10px 0;
  }

  /* Buttons — touch-friendly */
  .btn{
    min-height:44px;
    padding:8px 18px;
    font-size:12px;
  }

  /* Status badges — keep readable */
  .status-badge,
  .badge-full,
  .staff-full{
    font-size:11px;
    padding:4px 10px;
  }

  /* Loading / empty states */
  .loading-state,.empty-state{
    padding:60px 16px;
  }

  /* Footer */
  .page-footer{
    padding:20px 16px 56px;
    gap:12px;
  }
  .page-footer a{
    font-size:13px;
    padding:10px 18px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
}

/* --- Mobile portrait (<=480px) --- */
@media(max-width:480px){
  /* Header — minimize nav, compact */
  .poster-header{
    padding:0 12px;
    height:48px;
  }
  .poster-header .site-title{
    font-size:15px;
  }
  .poster-header .header-left{
    gap:8px;
  }
  .poster-header .header-nav{
    gap:1px;
  }
  .poster-header .header-nav a{
    font-size:11px;
    padding:6px 10px;
    min-height:40px;
    letter-spacing:0;
  }

  /* Theme toggle */
  .theme-toggle{
    width:40px;
    height:40px;
    font-size:15px;
  }

  /* Main container */
  .main-container{
    padding:62px 12px 24px;
  }

  /* Page header */
  .page-header{
    margin-bottom:24px;
  }
  .page-title{
    font-size:clamp(20px,5vw,24px);
    margin-bottom:4px;
  }
  .page-subtitle{
    font-size:12px;
  }

  /* Event cards */
  .event-card{
    padding:16px;
    margin-bottom:10px;
  }
  .event-name{
    font-size:clamp(16px,4vw,18px);
    margin-bottom:6px;
  }
  .event-meta{
    gap:8px;
    font-size:11px;
    margin-bottom:8px;
  }
  .event-meta span{
    gap:3px;
  }
  .event-desc{
    font-size:12px;
    line-height:1.5;
    margin-bottom:14px;
    -webkit-line-clamp:4;
  }

  /* Apply section — stack vertically */
  .apply-row{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }
  .apply-row-left{
    width:100%;
    gap:8px;
  }
  .apply-row-right{
    width:100%;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .apply-type-label{
    font-size:10px;
    min-width:32px;
  }
  .apply-divider{
    margin:8px 0;
  }

  /* Buttons — full-width primary, good spacing for pairs */
  .btn{
    min-height:44px;
    padding:8px 16px;
    font-size:12px;
    flex:1 1 auto;
  }
  .btn-edit,
  .btn-delete{
    flex:1 1 0;
    min-width:0;
  }
  .btn-apply{
    flex:1 1 100%;
  }
  .btn-login,
  .btn-disabled{
    flex:1 1 100%;
    text-align:center;
    justify-content:center;
  }
  .badge-full,
  .staff-full{
    flex:1 1 100%;
    text-align:center;
    justify-content:center;
    display:inline-flex;
    padding:6px 12px;
  }

  /* Status badges */
  .status-badge{
    font-size:11px;
    padding:3px 8px;
  }

  /* Loading / empty */
  .loading-state,.empty-state{
    padding:48px 12px;
    font-size:13px;
  }

  /* Footer — stack links vertically */
  .page-footer{
    flex-direction:column;
    gap:10px;
    padding:16px 12px 48px;
  }
  .page-footer a{
    width:100%;
    text-align:center;
    justify-content:center;
    min-height:44px;
    font-size:13px;
    padding:10px 16px;
  }
}

/* --- Extra small screens (<=375px) --- */
@media(max-width:375px){
  /* Header */
  .poster-header{
    padding:0 10px;
    height:48px;
  }
  .poster-header .site-title{
    font-size:14px;
  }
  .poster-header .header-nav a{
    font-size:10px;
    padding:6px 7px;
    min-height:38px;
  }

  /* Theme toggle */
  .theme-toggle{
    width:38px;
    height:38px;
    font-size:14px;
  }

  /* Main container */
  .main-container{
    padding:60px 10px 20px;
  }

  /* Page header */

    font-size:clamp(18px,5vw,20px);
  }
  .page-subtitle{
    font-size:11px;
  }

  /* Event cards */

  }
  .event-name{

  .apply-row-left{
    gap:6px;
  }
  .apply-row-right{

  }

    font-size:10px;
    min-width:28px;
  }

  /* Buttons */

    padding:6px 12px;

  /* Status badges */

  .staff-full{

  /* Footer */

  }
}
</style>
<script defer src="../js/analytics.js?v=20260905-analytics"></script>
</head>
<body>

<!-- HEADER -->
<header class="poster-header" role="banner">
  <div class="header-left">
    <span class="site-title">GalOnly</span>
  </div>
  <nav class="header-nav" role="navigation" aria-label="主导航">
    <a href="galo_poster.html">活动海报</a>
    <a href="galgameonly_list.html" class="active" aria-current="page">活动列表</a>
    <a href="../index.html?guest=1">地图主页</a>
    <a href="../admin/Galonly_audit.html" id="auditNavLink" style="display:none">审核活动</a>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题"></button>
  </nav>
</header>

<!-- MAIN -->
<main class="main-container" role="main">
  <div class="page-header">
    <h1 class="page-title">高校专属通道</h1>
    <p class="page-subtitle">选择活动，申请摊位或成为工作人员</p>
  </div>

  <div id="eventList">
    <div class="loading-state">
      <div class="spinner" role="status" aria-label="加载中"></div>
      <p>正在加载活动列表...</p>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="page-footer" role="contentinfo">
  <a href="../index.html?guest=1" aria-label="返回主页">&larr; 返回主页</a>
  <a href="../admin/Galonly_audit.html" id="auditFooterLink" style="display:none" aria-label="审核活动">审核活动</a>
</footer>

<script src="../js/page-background.js?v=20260812-centralized-preferences"></script>
<script>
(function() {
  'use strict';

  /* ========== STATE ========== */
  var currentUser = null;
  var isAuditor = false;

  /* ========== INIT ========== */
  document.addEventListener('DOMContentLoaded', function() {
    checkLogin().then(function() {
      if (isAuditor) {
        var nav = document.getElementById('auditNavLink');
        var foot = document.getElementById('auditFooterLink');
        if (nav) nav.style.display = '';
        if (foot) foot.style.display = '';
      }
      loadEvents();
    });
  });

  /* ========== AUTH ========== */
  function checkLogin() {
    return fetch('../api/auth.php?action=me', { credentials: 'same-origin' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if ((data.success || data.logged_in) && (data.user || data.id)) {
          currentUser = data.user || data;
          isAuditor = !!(currentUser.is_audit || currentUser.is_auditor || currentUser.audit_permission || currentUser.can_audit || currentUser.role === 'super_admin' || currentUser.role === 'admin');
        }
      })
      .catch(function() {
        // Silently fail — no mock user in production
      });
  }

  /* ========== LOAD EVENTS ========== */
  function loadEvents() {
    var container = document.getElementById('eventList');
    fetch('../api/galonly.php?action=list_events', { credentials: 'same-origin' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success) {
          container.innerHTML = '<div class="empty-state"><p>网络错误，请稍后重试</p></div>';
          return;
        }
        var events = data.events || [];
        if (events.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>暂无活动</p></div>';
          return;
        }
        renderEvents(events);
      })
      .catch(function(err) {
        container.innerHTML = '<div class="empty-state"><p>网络错误，请稍后重试</p></div>';
      });
  }

  /* ========== RENDER EVENTS ========== */
  function renderEvents(events) {
    var container = document.getElementById('eventList');
    var html = '';
    for (var i = 0; i < events.length; i++) {
      html += buildEventCard(events[i]);
    }
    container.innerHTML = html;
    /* stagger reveal */
    var cards = container.querySelectorAll('.event-card');
    cards.forEach(function(card, idx) {
      card.style.animationDelay = (idx * 0.08) + 's';
      setTimeout(function() { card.classList.add('visible'); }, 60 * idx);
    });
  }

  function buildEventCard(ev) {
    var loggedIn = !!currentUser;
    var staffOnly = ev.staff_only === 1 || ev.staff_only === '1' || ev.staff_only === true;

    /* meta */
    var isPlaceholderDate = staffOnly && String(ev.date || '').slice(0, 10) === '2026-09-19';
    var metaParts = [];
    if (ev.date && !isPlaceholderDate) metaParts.push('<span>' + escapeHtml(ev.date) + '</span>');
    else if (staffOnly) metaParts.push('<span>日期待公布</span>');
    if (ev.location) metaParts.push('<span>' + escapeHtml(ev.location) + '</span>');
    if (ev.booth_count !== undefined) metaParts.push('<span>' + ev.booth_count + ' 个摊位</span>');

    /* booth row */
    var isBeijingEvent = String(ev.event_code || '').toLowerCase() === 'beijing';
    var boothBadge = getBoothStatusBadgeHtml(ev.user_application_status, isBeijingEvent);
    var boothButtons = getBoothButtonHtml(ev, loggedIn);

    /* staff row */
    var staffBadge = getStaffStatusBadgeHtml(ev.user_staff_application_status);
    var staffButtons = getStaffButtonHtml(ev, loggedIn);

    var card = '<article class="event-card" aria-label="' + escapeHtml(ev.title || ev.name || '') + '">'
      + '<h2 class="event-name">' + escapeHtml(ev.title || ev.name || '未命名活动') + '</h2>'
      + (metaParts.length ? '<div class="event-meta">' + metaParts.join('') + '</div>' : '')
      + (ev.description ? '<p class="event-desc">' + escapeHtml(ev.description) + '</p>' : '')
      + '<div class="event-footer">'
        + '<div class="apply-section">'
          /* booth row (hidden for staff-only events) */
          + (staffOnly ? '' :
              '<div class="apply-row booth-row">'
                + '<div class="apply-row-left">'
                  + '<span class="apply-type-label">摊位</span>'
                  + boothBadge
                + '</div>'
                + '<div class="apply-row-right">'
                  + boothButtons
                + '</div>'
              + '</div>'
              + '<div class="apply-divider" role="separator"></div>')
          /* staff row */
          + '<div class="apply-row staff-row">'
            + '<div class="apply-row-left">'
              + '<span class="apply-type-label">Staff</span>'
              + staffBadge
            + '</div>'
            + '<div class="apply-row-right">'
              + staffButtons
            + '</div>'
          + '</div>'
        + '</div>'
      + '</div>'
    + '</article>';
    return card;
  }

  /* ========== BOOTH STATUS BADGE ========== */
  function getBoothStatusBadgeHtml(status, isBeijing) {
    if (!status) return '<span class="status-badge status-none">未申请</span>';
    if (!isBeijing) {
      /* 上海等活动保持原有流程文案 */
      switch (status) {
        case 'pending':  return '<span class="status-badge status-pending">审核中</span>';
        case 'approved': return '<span class="status-badge status-approved">已通过</span>';
        case 'rejected': return '<span class="status-badge status-rejected">已拒绝</span>';
        default:         return '<span class="status-badge status-none">未申请</span>';
      }
    }
    switch (status) {
      case 'pending':          return '<span class="status-badge status-pending">审核中</span>';
      case 'approved':         return '<span class="status-badge status-approved">预选通过</span>';
      case 'rejected':         return '<span class="status-badge status-rejected">已驳回</span>';
      case 'phase2_pending':   return '<span class="status-badge status-pending">制品审核中</span>';
      case 'phase2_revision':  return '<span class="status-badge status-revision">打回修改</span>';
      case 'confirmed':        return '<span class="status-badge status-approved">正式摊主</span>';
      case 'shared':           return '<span class="status-badge staff-pooled">拼摊</span>';
      default:                 return '<span class="status-badge status-none">未申请</span>';
    }
  }

  /* ========== BOOTH BUTTONS ========== */
  function getBoothButtonHtml(ev, loggedIn) {
    var eventId = ev.id;
    var status = ev.user_application_status;
    var appId = ev.user_application_id;
    var regOpen = ev.registration_open;
    var deadline = ev.deadline;
    var maxApp = ev.max_applicants;
    var fullBadge = ev.is_full;
    var isBeijing = String(ev.event_code || '').toLowerCase() === 'beijing';
    var boothSubmitPage = isBeijing ? 'Beijing_Galonly_submit.html' : 'Shanghai_Galonly_submit.html';
    var guidelinesPage = isBeijing ? 'Beijing_Galonly_guidelines.html' : null;

    var statusHref = 'Galonly_status.html?event_id=' + eventId + (appId ? '&application_id=' + appId : '');
    var statusBtn = '<a class="btn btn-edit" href="' + statusHref + '" aria-label="查询申请状态">查询状态</a>';

    if (!status && (regOpen === 0 || regOpen === '0')) {
      return '<span class="btn btn-disabled">申请已关闭</span>';
    }

    if (!loggedIn) {
      return '<span class="btn btn-login">请先登录</span>';
    }

    /* deadline passed */
    if (deadline && new Date(deadline) < new Date()) {
      return '<span class="btn btn-disabled">申请已截止</span>';
    }

    /* full */
    if (fullBadge || (maxApp && ev.current_applicants >= maxApp)) {
      return '<span class="badge-full">摊位已满</span>';
    }

    if (!status) {
      /* not applied: Beijing goes through the notice page first */
      if (isBeijing && guidelinesPage) {
        return '<a class="btn btn-apply" href="' + guidelinesPage + '?event_id=' + eventId + '" aria-label="申请摊位">申请摊位</a>';
      }
      return '<a class="btn btn-apply" href="' + boothSubmitPage + '?event_id=' + eventId + '" aria-label="申请摊位">申请摊位</a>';
    }

    if (!isBeijing) {
      /* 上海等活动保持原有流程按钮 */
      if (status === 'pending' || status === 'rejected') {
        var legacyEdit = boothSubmitPage + '?event_id=' + eventId + '&application_id=' + appId;
        return '<a class="btn btn-edit" href="' + legacyEdit + '" aria-label="编辑摊位申请">编辑</a>'
          + '<button class="btn btn-delete" onclick="deleteBoothApplication(' + appId + ',this)" aria-label="删除摊位申请">删除</button>';
      }
      if (status === 'approved') {
        var legacyView = boothSubmitPage + '?event_id=' + eventId + '&application_id=' + appId;
        return '<a class="btn btn-edit" href="' + legacyView + '" aria-label="查看摊位申请">编辑</a>';
      }
      return '';
    }

    if (status === 'pending') {
      var editHref = boothSubmitPage + '?event_id=' + eventId + '&application_id=' + appId;
      return statusBtn
        + '<a class="btn btn-edit" href="' + editHref + '" aria-label="编辑摊位申请">编辑</a>'
        + '<button class="btn btn-delete" onclick="deleteBoothApplication(' + appId + ',this)" aria-label="删除摊位申请">删除</button>';
    }

    if (status === 'approved') {
      /* phase 1 passed: unlock merchandise form (Beijing) */
      var merchBtn = '<a class="btn btn-apply" href="Beijing_Galonly_merchandise.html?event_id=' + eventId + '&application_id=' + appId + '" aria-label="提交制品表单">提交制品</a>';
      var editHref2 = boothSubmitPage + '?event_id=' + eventId + '&application_id=' + appId;
      return merchBtn + statusBtn + '<a class="btn btn-edit" href="' + editHref2 + '" aria-label="编辑摊位申请">编辑</a>';
    }

    if (status === 'phase2_pending' || status === 'phase2_revision' || status === 'shared') {
      return statusBtn;
    }

    if (status === 'confirmed') {
      return '<a class="btn btn-apply" href="Galonly_confirmation.html?event_id=' + eventId + '&application_id=' + appId + '" aria-label="查看确认函">确认函</a>'
        + statusBtn;
    }

    if (status === 'rejected') {
      var editHref3 = boothSubmitPage + '?event_id=' + eventId + '&application_id=' + appId;
      return statusBtn
        + '<a class="btn btn-edit" href="' + editHref3 + '" aria-label="编辑摊位申请">编辑</a>'
        + '<button class="btn btn-delete" onclick="deleteBoothApplication(' + appId + ',this)" aria-label="删除摊位申请">删除</button>';
    }

    return '';
  }

  /* ========== STAFF STATUS BADGE ========== */
  function getStaffStatusBadgeHtml(status) {
    if (!status) return '<span class="status-badge status-none">未申请</span>';
    switch (status) {
      case 'pending':   return '<span class="status-badge status-pending">审核中</span>';
      case 'pooled':    return '<span class="status-badge staff-pooled">已进名单池</span>';
      case 'rejected':  return '<span class="status-badge status-rejected">已拒绝</span>';
      case 'confirmed': return '<span class="status-badge staff-confirmed">已确定</span>';
      default:          return '<span class="status-badge status-none">未申请</span>';
    }
  }

  /* ========== STAFF BUTTONS ========== */
  function getStaffButtonHtml(ev, loggedIn) {
    var eventId = ev.id;
    var status = ev.user_staff_application_status;
    var appId = ev.user_staff_application_id;
    var regOpen = ev.staff_registration_open;
    var deadline = ev.staff_deadline;
    var maxApp = Number(ev.staff_max_applicants || 0);
    var isBeijingEvent = String(ev.event_code || '').toLowerCase() === 'beijing';
    var guidelinesPage = isBeijingEvent ? 'Beijing_Galonly_staff_guidelines.html' : 'galonly_staff_guidelines.html';
    var submitPage = isBeijingEvent ? 'Beijing_Galonly_staff_submit.html' : 'galonly_staff_submit.html';

    if (!loggedIn) {
      return '<span class="btn btn-login">请先登录</span>';
    }

    if (status === 'pending' || status === 'pooled' || status === 'rejected') {
      var editHref = submitPage + '?event_id=' + eventId + '&application_id=' + appId;
      return '<a class="btn btn-edit" href="' + editHref + '" aria-label="编辑Staff申请">编辑</a>'
        + '<button class="btn btn-delete" onclick="deleteStaffApplication(' + appId + ',this)" aria-label="删除Staff申请">删除</button>';
    }

    if (status === 'confirmed') {
      var editHref2 = submitPage + '?event_id=' + eventId + '&application_id=' + appId;
      return '<a class="btn btn-edit" href="' + editHref2 + '" aria-label="查看Staff申请">编辑</a>';
    }

    /* manual override */
    if (regOpen === 0 || regOpen === '0') {
      return '<span class="btn btn-disabled">Staff申请已关闭</span>';
    }

    /* deadline passed */
    if (deadline && new Date(deadline) < new Date()) {
      return '<span class="btn btn-disabled">Staff申请已截止</span>';
    }

    /* max reached (circuit breaker) */
    if (maxApp > 0 && ev.staff_current_applicants !== undefined && Number(ev.staff_current_applicants || 0) >= maxApp) {
      return '<span class="staff-full">Staff申请已满</span>';
    }

    if (!status) {
      /* not applied */
      return '<a class="btn btn-apply" href="' + guidelinesPage + '?event_id=' + eventId + '" aria-label="申请Staff">申请Staff</a>';
    }

    return '';
  }

  /* ========== DELETE BOOTH APPLICATION ========== */
  window.deleteBoothApplication = function(appId, btn) {
    if (!confirm('确定要删除该摊位申请吗？')) return;
    btn.disabled = true;
    btn.textContent = '删除中...';
    fetch('../api/galonly.php?action=delete_application', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ application_id: appId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        loadEvents();
      } else {
        alert('删除失败: ' + (data.error || '未知错误'));
        btn.disabled = false;
        btn.textContent = '删除';
      }
    })
    .catch(function() {
      alert('网络错误，请稍后重试');
      btn.disabled = false;
      btn.textContent = '删除';
    });
  };

  /* ========== DELETE STAFF APPLICATION ========== */
  window.deleteStaffApplication = function(appId, btn) {
    if (!confirm('确定要删除该 Staff 申请吗？')) return;
    btn.disabled = true;
    btn.textContent = '删除中...';
    fetch('../api/galonly.php?action=delete_staff_application', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ application_id: appId })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        loadEvents();
      } else {
        alert('删除失败: ' + (data.error || '未知错误'));
        btn.disabled = false;
        btn.textContent = '删除';
      }
    })
    .catch(function() {
      alert('网络错误，请稍后重试');
      btn.disabled = false;
      btn.textContent = '删除';
    });
  };

  /* ========== UTILS ========== */
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

})();
</script>
<script>
/* ========== THEME TOGGLE（与主站 themePreference 同步） ========== */
function toggleTheme() {
  if (window.VNFTheme && typeof window.VNFTheme.toggle === 'function') {
    window.VNFTheme.toggle();
  }
}
function updateThemeIcon(theme) {
  var btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.textContent = theme === 'dark' ? '\u263E' : '\u2600';
}
if (window.VNFTheme && typeof window.VNFTheme.subscribe === 'function') {
  window.VNFTheme.subscribe(function(detail) {
    updateThemeIcon(detail.theme);
  });
}
</script>
</body>
