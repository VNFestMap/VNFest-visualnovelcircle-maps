  <title>同好会十二部最佳作品评选赛 - VNFest</title>
  <link rel="stylesheet" href="../css/site-header.css?v=20260827-site-header" />

  <script src="../js/theme-runtime.js?v=20260702-theme"></script>

<script defer src="../js/analytics.js?v=20260905-analytics"></script>
</head>
<body>
  <header class="md-topbar">
    <a class="md-back" href="index.html">← 返回活动列表</a>
    <button id="themeToggle" class="md-theme-toggle" title="切换明亮/暗色模式" aria-label="切换明亮/暗色模式">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <section class="md-hero">
    <div class="md-hero-meta">
      <span class="md-pill md-pill--brand">十二器</span>
      <span class="md-pill" id="mdStatusBadge">加载中</span>
    </div>
    <h1 class="md-hero-title" id="mdContestTitle">加载中...</h1>
    <p class="md-hero-sub" id="mdContestSub">同好会十二部最佳作品评选赛</p>
    <div class="md-countdown" id="mdCountdown">--天 --:--:--</div>
  </section>

  <div class="guest-banner" id="twGuestBanner" hidden role="status"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>免登录参与模式 — 通过分享链接打开，无需登录即可投票；票数记录在本设备，同一设备每阶段计一票。</span></div>

  <nav class="md-stage-nav" id="mdStageNav" aria-label="阶段导航">
    <div class="md-stage-list" id="mdStageList"></div>
  </nav>

  <div class="md-layout">
    <main class="md-main" id="mdMain">
      <div class="md-panel md-panel--main" id="mdMainPanel">
        <div class="md-loading">加载中...</div>
      </div>
    </main>

    <aside class="md-sidebar" id="mdSidebar">
      <div class="md-panel" id="mdInfoPanel">
        <h2 class="md-panel-title">活动信息</h2>
        <div class="md-info-list" id="mdInfoList">
          <div class="md-info-row"><span>同好会</span><span id="mdInfoClub">-</span></div>
          <div class="md-info-row"><span>当前阶段</span><span id="mdInfoStage">-</span></div>
          <div class="md-info-row"><span>开始时间</span><span id="mdInfoStart">-</span></div>
          <div class="md-info-row"><span>截止时间</span><span id="mdInfoEnd">-</span></div>
        </div>
      </div>

      <div class="md-panel" id="mdTimelinePanel">
        <h2 class="md-panel-title">阶段时间线</h2>
        <div class="md-timeline" id="mdTimeline"></div>
      </div>

      <div class="md-panel" id="mdRankPanel" style="display:none;">
        <h2 class="md-panel-title">排行榜</h2>
        <div class="md-rank-list" id="mdRankList"></div>
      </div>
    </aside>
  </div>

  <div class="md-bottom-bar" id="mdBottomBar" style="display:none;">
    <span class="md-bottom-hint" id="mdBottomHint"></span>
    <button class="md-btn md-btn--primary" id="mdBottomSubmit">提交投票</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/vote-common.js?v=20260830-flowfix"></script>
  <script src="twelve-detail.js?v=20260830-flowfix"></script>
  <script>initVoteThemeToggle('themeToggle');</script>

</html>
